[package]
name = "campfire_views"
version = "0.1.0"
edition.workspace = true

[dependencies]
bnum.workspace = true
rails_compat.workspace = true
askama = { workspace = true, features = ["blocks"] }
campfire_routes.workspace = true
campfire_richtext.workspace = true
# The bundled tzdb (2026c, as the reference image's zoneinfo) so zones render the same wherever
# the binary runs, zoneinfo installed or not.
jiff = { workspace = true, features = ["tzdb-bundle-always"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
regex.workspace = true
unicode-segmentation.workspace = true

[dev-dependencies]
campfire_assets.workspace = true
campfire_storage.workspace = true
