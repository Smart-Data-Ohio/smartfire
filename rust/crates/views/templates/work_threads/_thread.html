<div class="work-threads__item" role="listitem">
  <a class="work-threads__item-link" href="{{ row.path }}">
    <div class="work-threads__item-heading">
      <strong class="work-threads__name">{{ row.name }}</strong>
      <span class="work-threads__status work-threads__status--{{ row.status }}">{{ row.status_label }}</span>
    </div>
    <span class="work-threads__channel">{{ row.room_name }}</span>
    <span class="work-threads__owner">{{ row.owner_label }}{% if row.agent %}<span class="agent-badge">agent</span>{% endif %}</span>
    <span class="work-threads__activity">{{ row.count }} {% if row.count == 1 %}message{% else %}messages{% endif %} · Updated {{ self.updated_time() }}</span>
</a>  {{ self.links() }}
</div>{{ "\n" }}
