{%- filter button_to(self.action(),h::attrs().class("sidebar-item direct direct--placeholder")) %}
  <span class="avatar">
    {{ h::image_tag(ctx,user.avatar_path.as_str(),h::attrs().aria_hidden()) }}
  </span>

  <span class="direct__author min-width">
    <span class="overflow-ellipsis">
      <span class="for-screen-reader">Start a ping with</span>
      {{ user.first_name() }}
    </span>
  </span>
{% endfilter %}{{ "" }}
