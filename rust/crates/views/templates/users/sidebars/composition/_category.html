  <section class="sidebar-section sidebar-section--category rooms" aria-labelledby="room-category-{{ category.id }}-heading" data-category-drop="{{ category.id }}">
    <header class="sidebar-section__header room-category__header">
      <form data-turbo-frame="user_sidebar" class="button_to" method="post" action="/room_categories/{{ category.id }}"><input type="hidden" name="_method" value="patch" /><button class="btn sidebar-section__collapse" aria-label="{{ category.toggle_label() }} {{ category.name }}" title="{{ category.toggle_label() }}" type="submit">
        {{ h::image_tag(ctx,"disclosure.svg",h::attrs().aria_hidden().size(16).attr_opt("class", category.collapsed.then_some("room-category__disclosure--collapsed"))) }}
</button>{{ h::token_tag(category.action().as_str(),"patch") }}<input type="hidden" name="room_category[collapsed]" value="{{ !category.collapsed }}" /></form>      <h2 id="room-category-{{ category.id }}-heading" class="overflow-ellipsis">{{ category.name }}</h2>
      <details class="room-category__rename">
        <summary class="btn sidebar-section__tool" aria-label="Rename {{ category.name }}" title="Rename">Rename</summary>
        <form class="room-category__rename-form" data-turbo-frame="user_sidebar" action="/room_categories/{{ category.id }}" accept-charset="UTF-8" method="post"><input type="hidden" name="_method" value="patch" />{{ h::token_tag(category.action().as_str(),"patch") }}
          <input value="{{ category.name }}" required="required" maxlength="50" autocomplete="off" aria-label="New name for {{ category.name }}" size="50" type="text" name="room_category[name]" id="room_category_name" />
          <input type="submit" name="commit" value="Save" class="btn" data-disable-with="Save" />
</form>      </details>
      <form data-turbo-frame="user_sidebar" class="button_to" method="post" action="/room_categories/{{ category.id }}"><input type="hidden" name="_method" value="delete" /><button class="btn sidebar-section__tool" aria-label="Delete {{ category.name }}" title="Delete" data-turbo-confirm="Delete “{{ category.name }}”? Its channels move back to Channels." type="submit">
        <img aria-hidden="true" src="{{ ctx.asset("trash.svg") }}" width="16" height="16" />
</button>{{ h::token_tag(category.action().as_str(),"delete") }}</form>    </header>

    <div id="category_rooms_{{ category.id }}" class="sidebar-list{% if category.rows.is_empty() %} sidebar-list--empty{% endif %}"{% if category.collapsed %} hidden{% endif %}>
{{ self.rows()|safe }}    </div>
  </section>
{{ "" }}
