{%- filter link_to_room(row.id,row.options()) %}
  <span class="sidebar-item__icon{% if row.call.icon.is_some() %} sidebar-item__icon--custom{% endif %}" aria-hidden="true">{{ h::icon_avatar_tag(ctx,row.call.icon.as_ref(),24,h::attrs()) }}</span>
  <span class="sidebar-item__label overflow-ellipsis">{{ row.name }}</span>
  {%- if configured %}
    <span class="voice-room__trailing">
      {{ row.participants()|safe }}
    </span>
  {%- endif %}
  {%- if row.call.unread %}
    <span class="sidebar-item__status">New</span>
  {%- endif %}
{% endfilter %}
{{ "" }}
