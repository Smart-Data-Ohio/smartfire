<div class="multi-select-bar" data-multi-select-target="bar" hidden>
  {% let form = h::form_with(h::routes::rooms_directs()).class("multi-select-bar__form").data("multi_select_target", "form").data("action", "turbo:submit-end->multi-select#submitted") %}{% filter form_with(form) %}
    <div data-multi-select-target="inputs"></div>
    <input type="hidden" name="start_huddle" value="" data-multi-select-target="huddleInput">

    <button type="submit" class="btn btn--reversed" data-multi-select-target="messageButton">Message (0)</button>
    <button type="submit" class="btn" data-action="click->multi-select#submitHuddle"
        data-multi-select-target="huddleButton">Start huddle (0)</button>
{% if exit_button %}      <button type="button" class="btn" data-action="click->multi-select#clear"
          aria-label="Exit selection mode" title="Exit selection mode">✕</button>
{% else %}      <button type="button" class="btn" data-action="click->multi-select#clear">Clear</button>
{% endif %}{% endfilter %}
  <p class="multi-select-bar__note" role="status" data-multi-select-target="note" hidden></p>
</div>
<span class="for-screen-reader" role="status" data-multi-select-target="status">0 selected</span>{{ "\n" }}
