<dialog id="poll-builder" class="poll-builder" aria-labelledby="poll-builder-title" data-controller="poll-builder">
  <div class="poll-builder__panel">
    <div class="poll-builder__header">
      <h2 id="poll-builder-title">Create a poll</h2>
      <button type="button" class="btn btn--borderless" data-action="poll-builder#close" aria-label="Close poll builder">✕</button>
    </div>

    <form class="poll-builder__form" action="/rooms/{{ room.id }}/polls" accept-charset="UTF-8" method="post">{{ h::token_tag(self.form_action("polls").as_str(), "post") }}
      <div>
        <label for="poll_question">Question</label>
        <input type="text" name="poll[question]" id="poll_question" class="input" required="required" maxlength="1000" autocomplete="off" data-poll-builder-target="question" />
      </div>

      <fieldset class="poll-builder__options">
        <legend>Options (2–10)</legend>
        <div data-poll-builder-target="options">
          <div class="poll-builder__option">
            <label class="for-screen-reader" for="poll_option_0">Option 1</label>
            <input type="text" name="poll[options][]" id="poll_option_0" class="input" required="required" maxlength="200" autocomplete="off" />
          </div>
          <div class="poll-builder__option">
            <label class="for-screen-reader" for="poll_option_1">Option 2</label>
            <input type="text" name="poll[options][]" id="poll_option_1" class="input" required="required" maxlength="200" autocomplete="off" />
          </div>
        </div>
        <p class="poll-builder__options-actions">
          <button type="button" class="btn btn--plain btn--small" data-action="poll-builder#addOption"
              data-poll-builder-target="addButton">Add option</button>
        </p>
      </fieldset>

      <div class="poll-builder__flags">
        <label class="poll-builder__flag">
          <input type="checkbox" name="poll[multiple]" id="poll_multiple" value="1" /> Allow multiple choices
        </label>
        <label class="poll-builder__flag">
          <input type="checkbox" name="poll[anonymous]" id="poll_anonymous" value="1" /> Anonymous (counts only, no voter names)
        </label>
      </div>

      <div>
        <label for="poll_closes_at">Closes at (optional)</label>
        <input type="datetime-local" name="poll[closes_at]" id="poll_closes_at" class="input" />
        <p class="txt-small poll-builder__hint">In your time zone. Votes lock when the poll closes.</p>
      </div>

      <div class="poll-builder__footer">
        <button type="button" class="btn btn--plain" data-action="poll-builder#close">Cancel</button>
        <input type="submit" name="commit" value="Post poll" class="btn btn--primary" data-disable-with="Post poll" />
      </div>
</form>  </div>
</dialog>
