<span id="{{ self.dom_id() }}"
      class="{{ self.class() }}"
      role="group"
      aria-label="{{ self.accessible_label() }}"
      title="{{ self.accessible_label() }}"
      data-controller="huddle-participants"
      data-huddle-participants-url-value="/rooms/{{ room_id }}/huddle/participants"
      data-huddle-participants-max-value="{{ self.max_avatars() }}"
      data-huddle-participants-interval-value="{{ self.interval() }}"
      data-huddle-participants-label-value="{{ self.label() }}"
      data-huddle-participants-card-url-template-value="/users/USER_ID/card"
      data-huddle-presence-room-id="{{ room_id }}">
  <span class="voice-stack__avatars" data-huddle-participants-target="avatars">
{{ self.avatars() }}  </span>
  <span class="voice-stack__count" data-huddle-participants-target="count" {% if participants.is_empty() %}hidden{% endif %}>{% if !participants.is_empty() %}{{ participants.len() }}{% endif %}</span>
</span>{{ "\n" }}
