<div class="room-header__identity room--current min-width" id="{{ row.dom_id("header") }}">
  <span class="room-header__kind">{% if row.stage %}Stage channel{% else %}Voice channel{% endif %}</span>
  <h1 class="room__contents overflow-ellipsis">
    {%- if row.icon.is_some() %}
      {{ h::icon_avatar_tag(ctx,row.icon.as_ref(),32,h::attrs().class("room-header__icon")) }}
    {%- else %}
      <span class="room-header__hash" aria-hidden="true">#</span>
    {%- endif %}

    <span class="room-header__name overflow-ellipsis">{{ row.name }}</span>
  </h1>
</div>
