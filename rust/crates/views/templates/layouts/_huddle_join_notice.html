{#- reference/app/views/layouts/_huddle_join_notice.html.erb. The container is the live region:
    toasts arrive with text already in them, so they carry no live-region roles of their own. -#}
<div id="huddle-join-notices" data-controller="huddle-join-notice" data-turbo-permanent>
  <div class="huddle-join-toasts" data-huddle-join-notice-target="toasts" aria-live="polite"></div>
  <div data-controller="sound"
       data-huddle-join-notice-target="sound"
       data-sound-url-value="{{ h::asset_path(ctx, "incoming.mp3") }}"
       hidden></div>
</div>
