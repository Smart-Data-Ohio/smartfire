[package]
name = "campfire_db"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
campfire_richtext.workspace = true
rails_compat.workspace = true
campfire_storage.workspace = true
rusqlite.workspace = true
jiff.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml = { workspace = true, optional = true }
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio.workspace = true
bcrypt.workspace = true
rand.workspace = true
uuid.workspace = true
sha1.workspace = true
hex.workspace = true
crc32fast.workspace = true
tracing.workspace = true
base64.workspace = true
regex.workspace = true
caseless.workspace = true

[features]
# `campfire_db::fixtures`: the reference's test fixtures, loaded into a database for tests.
test-support = ["dep:serde_yaml", "rusqlite/trace"]

[dev-dependencies]
rusqlite = { workspace = true, features = ["trace", "limits"] }
campfire_db = { path = ".", features = ["test-support"] }
tempfile.workspace = true
