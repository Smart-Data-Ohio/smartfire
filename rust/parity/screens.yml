  - id: composer/with_text
    area: composer
    path: /rooms/{{rooms.designers}}
    as: david
    steps:
      # Exercise the pagination threshold deterministically before mobile composer reflow.
      - scroll: { selector: '.messages', to: top }
      - scroll: { selector: '.messages', to: bottom }
      - fill:
          selector: .composer__textarea
          text: |-
            **Ready** to ship

            - Verify parity
    smoke: true
  - id: composer/attachment_menu
    area: composer
    path: /rooms/{{rooms.designers}}
    as: david
    steps:
      - click: '[data-action*="attach-menu#toggle"]'
      - wait_for: .attach-menu:popover-open
  - id: composer/schedule_dialog
    area: composer
    path: /rooms/{{rooms.designers}}
    as: david
    steps:
      - fill:
          selector: .composer__textarea
          text: A scheduled reminder
      - click: '[data-action="schedule-send#open"]'
      - wait_for: "#schedule-send[open]"
  - id: composer/mention_autocomplete
    area: composer
    path: /rooms/{{rooms.designers}}
    as: david
    steps:
      - fill:
          selector: .composer__textarea
          text: "@ja"
  - id: composer/header_menu
    area: composer
    path: /rooms/{{rooms.designers}}
    as: david
    steps:
      - click: "#header-overflow-button"
      - wait_for: "#header-overflow-menu:popover-open"
    matrix:
      viewports:
        - phone
  - id: composer/shortcuts
    area: composer
    path: /rooms/{{rooms.designers}}
    as: david
    steps:
      - click: "#help-menu-button"
      - click: '[data-action="help-menu#openShortcuts"]'
      - wait_for: "#keyboard-shortcuts[open]"
  - id: composer/quick_switcher
    area: composer
