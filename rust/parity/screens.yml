    as: david
    kind: fragment
  - id: messages/actions
    area: messages
    path: /rooms/{{rooms.designers}}/messages/{{messages.markdown}}/actions.json
    as: david
    kind: fragment
  - id: messages/forward_source
    area: messages
    path: /rooms/{{rooms.designers}}/messages/{{messages.markdown}}/forward_source.json
    as: david
    kind: fragment
  - id: messages/forward_destinations
    area: messages
    path: /rooms/{{rooms.designers}}/messages/{{messages.markdown}}/forwards/destinations.json
    as: david
    kind: fragment
  - id: messages/edit
    area: messages
    path: /rooms/{{rooms.designers}}/messages/{{messages.markdown}}/edit
    as: david
    kind: fragment
    covers:
      - messages/edit
  - id: messages/boosts
    area: messages
    path: /messages/{{messages.boosted_many}}/boosts
    as: david
    kind: fragment
    covers:
      - messages/boosts/index
  - id: messages/new_boost
    area: messages
    path: /messages/{{messages.markdown}}/boosts/new
    as: david
    kind: fragment
    covers:
      - messages/boosts/new
  - id: polls/open
    area: polls
    path: /rooms/{{rooms.designers}}/polls/{{polls.launch}}.json
    as: david
    kind: fragment
  - id: polls/closed
    area: polls
    path: /rooms/{{rooms.designers}}/polls/{{polls.closed}}.json
    as: david
    kind: fragment
  - id: channels/unread_sidebar
    area: channels
    path: /users/me/profile
    as: david
    seed: unread
    smoke: true
  - id: auth/first_run
    area: auth
    path: /first_run
    seed: first_run
    covers:
      - first_runs/show
  - id: voice/participants
    area: voice
    path: /rooms/{{rooms.voice}}/huddle/participants.json
    as: david
    seed: live_rooms
    kind: fragment
  - id: voice/active_room
    area: voice
    path: /rooms/{{rooms.voice}}
    as: david
    seed: live_rooms
  - id: stage/live
    area: stage
    path: /rooms/{{rooms.stage}}
    as: david
    seed: live_rooms
    smoke: true
  - id: stage/live_panel
    area: stage
    path: /rooms/{{rooms.stage}}
    as: david
    seed: live_rooms
    steps:
      - click: '[aria-label="Show stage"]'
  - id: events/live_venue
    area: events
    path: /rooms/{{rooms.designers}}/events/{{events.launch_party}}
    as: david
    seed: live_rooms
  - id: realtime/message_sent
    area: realtime
    path: /rooms/{{rooms.designers}}
    as: david
    mutates: true
    steps:
      - fill:
          selector: .composer__textarea
          text: A deterministic live message
      - click: button[name=send]
      - wait_for: .message:has-text("A deterministic live message")
  - id: realtime/thread_reply
    area: realtime
    path: /rooms/{{rooms.designers}}
    as: david
    mutates: true
    steps:
      # Open after initial member-panel loading settles; query-string auto-open races its abort.
      - click: '[data-action="thread-panel#toggle"]'
      - wait_for: '#thread-panel .thread-panel__thread-item[data-thread-id="{{threads.launch}}"]'
      - click: '#thread-panel .thread-panel__thread-item[data-thread-id="{{threads.launch}}"]'
      - fill:
          selector: '#thread-panel .composer__textarea'
          text: A deterministic thread reply
      - click: '#thread-panel button[name=send]'
      - wait_for: '#thread-panel .message:has-text("A deterministic thread reply")'
      # Pin the background timeline viewport after the panel reflows its lazy images/cards.
      - scroll: { selector: '.messages', to: bottom }
  - id: integrations/slack_workspace_preview
    area: integrations
    path: /account/slack_import/runs/{{slack_imports.workspace}}
    kind: page
    seed: imports
    as: david
  - id: integrations/slack_plan
    area: integrations
    path: /account/slack_import/runs/{{slack_imports.workspace}}/plan
    kind: page
    seed: imports
    as: david
  - id: integrations/slack_workspace_status
    area: integrations
    path: /account/slack_import/runs/{{slack_imports.workspace}}/status
    kind: fragment
    seed: imports
    as: david
  - id: integrations/slack_personal_preview
    area: integrations
    path: /slack/imports/{{slack_imports.personal}}
    kind: page
    seed: imports
    as: david
  - id: integrations/slack_personal_status
    area: integrations
    path: /slack/imports/{{slack_imports.personal}}/status
    kind: fragment
    seed: imports
    as: david
  - id: integrations/slack_failed
    area: integrations
    path: /account/slack_import/runs/{{slack_imports.failed}}
    kind: page
    seed: imports
    as: david
