  - id: auth/password_to_challenge
    area: auth
    path: /session/new
    mutates: true
    steps:
      - fill: { selector: 'input[name="email_address"]', text: '{{emails.david}}' }
      - fill: { selector: 'input[name="password"]', text: '{{passwords.all}}' }
      - click: 'button[name="log_in"]'
      - wait_for: 'input[name="code"]'
  - id: auth/password_rejected
    area: auth
    path: /session/new
    # Turbo reloads this rejection to GET /session/new (200), losing flash.now in Rails.
    # Require the 401 POST; keep the actual resulting sign-in screen as the reference.
    expect_responses: [{ method: POST, path: /session, status: 401 }]
    mutates: true
    steps:
      - fill: { selector: 'input[name="email_address"]', text: '{{emails.david}}' }
      - fill: { selector: 'input[name="password"]', text: incorrect-password }
      - click: 'button[name="log_in"]'
      - wait_for: 'input[name="email_address"]'
  - id: auth/transfer_form
