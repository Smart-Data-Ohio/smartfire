  - id: auth/two_factor_rejected
    area: auth
    path: /two_factor_challenge
    as: challenge
    expect_final_status: 422
    mutates: true
    steps:
      - fill: { selector: 'input[name="code"]', text: invalid-code }
      - click: 'button[type="submit"]'
      - wait_for: '[role="alert"]:has-text("Check your authenticator")'
  - id: auth/sudo_rejected
    area: auth
    path: /sudo/new
    as: david
    expect_final_status: 401
    mutates: true
    steps:
      - fill: { selector: 'input[name="password"]', text: incorrect-password }
      - click: 'button[name="confirm"]'
      - wait_for: '[role="alert"]:has-text("Confirmation failed")'
