# No approved divergences from Smartfire. Self-parity always ignores this file.
# Inherited normalization cases (not divergence grants):
# - Form/CSRF meta: random token values only; fields/destinations/attributes remain.
# - CSP script/style/meta nonces: fresh per response; element structure remains.
# - Signed IDs/SGIDs/streams: retain record/purpose/payload; ignore signature bytes.
#   Frozen-clock expiries retain exact offsets. Golden vectors cover cookie/signature bytes.
# - Encrypted pending-session cookies: random IV/ciphertext; cookie names/attributes remain.
#   Pending 2FA and verified-session behaviors are separately exercised, never merged.
# - Attachment object URLs: browser UUID; file bytes and surrounding DOM remain.
# - Asset filenames: Propshaft digest in DOM; network request digest remains checked.
#   Digest-named bodies are not independently rehashed (an inherited comparison limit).
# - QR URLs: decode destination; join/transfer URL meaning remains visible.
# - ISO/epoch times: exact offset from fixed seed time, not arbitrary timestamp removal.
# - Transport headers: omit Date/request ID/runtime/encoding bookkeeping; retain status,
#   content type, redirect, cache, disposition, vary, cookie names/attributes.
# - Duplicate network requests: latest per method+URL; browser preload/cache ordering.
# - Disk blob keys/disposition: opaque storage key; signed blob ID/media hash remain.
# - Cable: subscription/outcome and broadcast sets; omit heartbeat/duplicate delivery order.
#   Mutation states record broadcasts; background presence is not a UI state.
# No state-specific values/pixels or asset/PWA bodies are hidden to force agreement.
