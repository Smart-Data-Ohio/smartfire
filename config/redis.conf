port 6379
daemonize no
# Durable queue: jobs survive a Redis or container restart. Only
# /rails/storage persists (the mounted volume; see docs/self-hosting.md),
# so the append-only file must live there — the default dir (the app root)
# is discarded with the container. This file is only used by the Procfile
# redis process in production; development runs its own Redis container.
dir /rails/storage
appendonly yes
appendfsync everysec
save ""
