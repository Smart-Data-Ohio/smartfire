<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      viewport-fit=cover lets the app draw under the notch and home indicator (tokens.css pads with
      --safe-*); resizes-content has Android shrink the page for the keyboard rather than overlay it.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!--
      The browser and status bar take the top surface's colour (--bg-sidebar, kept in step by
      src/styles/tokens.test.ts); a pinned theme repoints both media queries (src/lib/appearance.ts).
    -->
    <meta name="theme-color" content="#f1f4f6" media="(prefers-color-scheme: light)" data-scheme="light" />
    <meta name="theme-color" content="#141619" media="(prefers-color-scheme: dark)" data-scheme="dark" />
    <title>Smartfire</title>
    <!--
      The cascade-layer order, ahead of every stylesheet. The build splits CSS per chunk and links
      shared chunks' sheets (kbd, tooltip, ...) before the entry's, and the minifier drops the
      order statement from tokens.css; whichever sheet names a layer first fixes its rank, so
      without this `ui` would rank below `base` in production and the reset would undo the
      components. Kept in step with tokens.css by src/styles/tokens.test.ts.
    -->
    <style>@layer tokens, base, motion, recipes, ui, app;</style>
    <!-- The Rust shell (crates/spa) puts the CSRF meta and the boot JSON here. -->
    <!--boot-->
    <script>
      // Blocking, before the stylesheet can paint: the theme pinned on this device, else the
      // account's theme and text size from the boot JSON just above; density and motion from this
      // device. src/lib/appearance.ts keeps them current afterwards. The Rust shell gives this
      // script the page's CSP nonce, as it does every script.
      (() => {
        const root = document.documentElement;
        const read = (text) => {
          try {
            const value = JSON.parse(text || "null");

            return value !== null && typeof value === "object" ? value : {};
          } catch {
            return {};
          }
        };
        let device = {};

        try {
          device = read(localStorage.getItem("smartfire.appearance"));
        } catch {
          // Storage can be unavailable; the account's choices still apply.
        }

        const boot = read(document.getElementById("boot")?.textContent);
        const pin = device.themeOverride;
        const theme = pin === "light" || pin === "dark" || pin === "system" ? pin : boot.theme;

        if (theme === "light" || theme === "dark") {
          root.dataset.theme = theme;
          for (const meta of document.querySelectorAll('meta[name="theme-color"][data-scheme]')) {
            meta.media = meta.dataset.scheme === theme ? "all" : "not all";
          }
        }
        root.dataset.textSize = ["smaller", "small", "large", "larger"].includes(boot.textSize)
          ? boot.textSize
          : "default";
        if (device.density === "compact") root.dataset.density = "compact";
        if (device.motion === "reduce" || device.motion === "full") root.dataset.motion = device.motion;
        // Exactly src/lib/appearance.ts's FONTS; anything else in storage is ignored there too.
        if (["system", "atkinson", "serif", "mono"].includes(device.font)) root.dataset.font = device.font;

        // A colour palette, by name: its tokens are built in here from src/lib/palette.ts
        // (vite.config.ts), the values the SPA sets when it starts. Nothing stored is applied.
        const presets = {/*palettes*/};
        const palette = device.palette;

        if (typeof palette === "string" && Object.hasOwn(presets, palette)) {
          root.dataset.palette = palette;
          for (const [name, value] of Object.entries(presets[palette])) root.style.setProperty(name, value);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
