name: Rust CI setup
description: Restore the committed test seeds, and prepare the toolchain image and Cargo cache used by every Rust gate.
inputs:
  parity:
    description: >-
      seeds: check the committed seeds (parity/seeds/frozen) against their manifest and this
      checkout's schema, then restore them to parity/.seed.
      none: no seeds.
    default: seeds
  toolchain:
    description: Build the toolchain image from the main-written Buildx cache
    default: 'true'
  cargo-cache:
    description: 'Cargo cache to restore: tests (nextest harnesses), build (clippy, binaries, doctests), or none'
    default: none
  free-disk:
    description: Delete unused preinstalled SDKs in the background
    default: 'true'
  save-caches:
    description: Write the toolchain image's Buildx cache (pushes to main only)
    default: 'false'
outputs:
  cargo-cache-hit:
    description: Whether the exact Cargo cache was restored (then nothing needs saving)
    value: ${{ steps.cargo-cache.outputs.cache-hit }}
  cargo-cache-key:
    description: >-
      The Cargo cache's content key: toolchains, build inputs and Cargo.lock, not the commit. One
      job saves it on a push to main only when no entry has that key yet.
    value: ${{ steps.cargo-key.outputs.prefix }}
runs:
  using: composite
  steps:
    # Deleting these SDKs takes one to two minutes; nothing below needs the space at once.
    - name: Make room for media and targets
      if: ${{ inputs.free-disk == 'true' }}
      shell: bash
      run: nohup sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc >/dev/null 2>&1 &

    # The seeds were built once by the Rails app and are committed; the manifest pins every
    # file, the keys their cookies and encrypted columns need, and the schema version.
    - name: Restore the committed test seeds
      if: ${{ inputs.parity == 'seeds' }}
      shell: bash
      run: python3 parity/bin/frozen-seeds restore

    - name: Set up Docker Buildx
      if: ${{ inputs.toolchain == 'true' }}
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      with:
        driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1

    # The Dockerfile's toolchain stage: Rust with the image's own libvips and ffmpeg builds.
    # Only pushes to main write caches. PRs and branch pushes may read but never write: this
    # prevents cache poisoning and keeps their multi-gigabyte targets from evicting the image
    # caches. Use immutable GitHub context directly, never a step-writable environment variable.
    - name: Build toolchain image
      if: ${{ inputs.toolchain == 'true' }}
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        file: Dockerfile
        target: toolchain
        tags: campfire-toolchain
        load: true
        push: false
        cache-from: type=gha,scope=rust-toolchain
        cache-to: ${{ inputs.save-caches == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' && 'type=gha,scope=rust-toolchain,mode=max' || '' }}

    # One cache per kind of build: the nextest harnesses' dependencies, clippy's check-mode
    # dependencies plus the binaries' and doctests'. Workspace crates are pruned before saving (ci/prune-target.py): a fresh
    # checkout's mtimes make Cargo rebuild them anyway. Every key, including the fallbacks, is
    # scoped to the toolchains (rust-toolchain.toml's nightly, the Dockerfile's stable release
    # and toolchain image), so an entry built by another compiler is never restored. The cache
    # holds only registry dependencies, which those inputs fully determine, so the key leaves out
    # the commit: a push to main that changes none of them restores an exact hit and saves nothing.
    - name: Name the Cargo cache
      id: cargo-key
      if: ${{ inputs.cargo-cache != 'none' }}
      shell: bash
      env:
        TOOLCHAIN: rust-cargo-v4-${{ inputs.cargo-cache }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Dockerfile') }}-
        INPUTS: ${{ hashFiles('Cargo.toml', 'crates/*/Cargo.toml', 'bench/*/Cargo.toml', '.cargo/config.toml', 'ci/cargo.sh', 'ci/cargo-config.toml') }}-
        LOCK: ${{ hashFiles('Cargo.lock') }}-
      run: |
        {
          echo "toolchain=$TOOLCHAIN"
          echo "inputs=$TOOLCHAIN$INPUTS"
          echo "prefix=$TOOLCHAIN$INPUTS$LOCK"
        } >> "$GITHUB_OUTPUT"

    - name: Restore cargo registry and target
      id: cargo-cache
      if: ${{ inputs.cargo-cache != 'none' }}
      # zizmor: ignore[cache-poisoning] -- nothing is published: the image above is only loaded locally
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          .cargo-home/registry
          target
        key: ${{ steps.cargo-key.outputs.prefix }}
        restore-keys: |
          ${{ steps.cargo-key.outputs.prefix }}
          ${{ steps.cargo-key.outputs.inputs }}
          ${{ steps.cargo-key.outputs.toolchain }}
