name: Repository checks

# Required jobs report on every PR and main push. Each job skips its costly steps when
# its inputs did not change. Only Dependency audit runs on the weekly schedule.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Advisories are published against code that hasn't changed; catch them between pushes.
  schedule:
    - cron: "17 6 * * 1"

permissions: {}

# A new push to a pull request supersedes the run for its previous commit.
# Other runs have unique groups so main keeps both queued and running jobs.
concurrency:
  group: repo-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-actions:
    name: GitHub Actions audit
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Decide whether these checks are needed
        id: scope
        env:
          PATTERN: '^\.github/'
        run: python3 .github/scripts/check-paths.py

      # The actionlint action builds a container from Docker Hub images, which hosted runners
      # often cannot pull (anonymous rate limit). The pinned release binary avoids that; the
      # runner image already ships shellcheck, which actionlint uses for run: scripts.
      - name: Run actionlint
        if: steps.scope.outputs.run == 'true'
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" actionlint
          "${RUNNER_TEMP}/actionlint" -color

      - name: Run zizmor
        if: steps.scope.outputs.run == 'true'
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          advanced-security: false

  # The release, backup and host scripts production runs, and the workflows that drive them:
  # the ops/ release contract (fake Docker/ONCE/cloud boundaries), the GCP configuration
  # helpers, and the backup contract (real sqlite, tar, gzip and gpg against a fake volume).
  # Tests that need a locally built image skip unless one is named.
  ops-scripts:
    name: Ops scripts
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # test_workflows.py compares deploy-gcp.yml with an older revision of itself, so it needs
      # the history; blobs are fetched only when read.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Decide whether these checks are needed
        id: scope
        env:
          PATTERN: '^(ops/|deploy/|\.github/workflows/)|^(Dockerfile|\.dockerignore)$|^\.github/scripts/check-paths\.py$|^\.github/workflows/repo\.yml$'
        run: python3 .github/scripts/check-paths.py

      - name: Test the release contract and workflows (ops)
        if: steps.scope.outputs.run == 'true'
        run: python3 -m unittest discover -s ops/tests -p 'test_*.py' -v

      - name: Test the GCP deployment configuration (deploy/gcp)
        if: steps.scope.outputs.run == 'true'
        run: python3 -m unittest discover -s deploy/gcp -p 'test_*.py' -v

      - name: Test the backup contract (deploy/backups)
        if: steps.scope.outputs.run == 'true'
        run: python3 -m unittest discover -s deploy/backups/tests -p 'test_*.py' -v

  test_gateway:
    name: Huddle authorization gateway
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Decide whether these checks are needed
        id: scope
        env:
          PATTERN: '^(huddle-gateway/|deploy/huddles/)|^\.github/scripts/check-paths\.py$|^\.github/workflows/repo\.yml$'
        run: python3 .github/scripts/check-paths.py

      - name: Set up Node
        if: steps.scope.outputs.run == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install gateway dependencies
        if: steps.scope.outputs.run == 'true'
        run: npm ci --ignore-scripts --prefix huddle-gateway

      - name: Test authorization and connection races
        if: steps.scope.outputs.run == 'true'
        run: npm test --prefix huddle-gateway

      - name: Test the media container runtime
        if: steps.scope.outputs.run == 'true'
        run: node --test deploy/huddles/runtime/*.test.mjs

      # Builds the media image exactly as the host does (compose.yaml, repository-root context
      # filtered by deploy/huddles/Dockerfile.dockerignore) without pushing it anywhere.
      - name: Build the huddle media image
        if: steps.scope.outputs.run == 'true'
        run: |
          export HUDDLES_ENV_FILE="$PWD/deploy/huddles/env.example"
          docker compose -f deploy/huddles/compose.yaml config --quiet
          docker compose -f deploy/huddles/compose.yaml build media

  # Known advisories against the dependencies production ships: the Rust binary's crates
  # (Cargo.lock) and the huddle gateway's npm runtime dependencies. Fails on any
  # vulnerability advisory that .cargo/audit.toml doesn't list, with its reason;
  # unmaintained/unsound notices are printed as warnings. Dependabot raises the update PRs.
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_AUDIT_VERSION: 0.22.2
      # sha256 of cargo-audit-x86_64-unknown-linux-musl-v0.22.2.tgz, as GitHub records it for
      # the rustsec/rustsec release asset.
      CARGO_AUDIT_SHA256: 7fb9497f8594b389e5fce5ef9b92db08432996895b2e0c5a0167a69ed445c428
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Decide whether these checks are needed
        id: scope
        env:
          PATTERN: '(^|/)Cargo\.(toml|lock)$|^huddle-gateway/package[^/]*\.json$|^frontend/pnpm-lock\.yaml$|^\.cargo/audit\.toml$|^\.github/scripts/check-paths\.py$|^\.github/workflows/repo\.yml$'
        run: python3 .github/scripts/check-paths.py

      - name: Install cargo-audit
        if: steps.scope.outputs.run == 'true'
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/cargo-audit"
          name="cargo-audit-x86_64-unknown-linux-musl-v${CARGO_AUDIT_VERSION}"
          mkdir -p "$dir"
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors \
            "https://github.com/rustsec/rustsec/releases/download/cargo-audit%2Fv${CARGO_AUDIT_VERSION}/${name}.tgz" \
            --output "$dir/cargo-audit.tgz"
          echo "${CARGO_AUDIT_SHA256}  $dir/cargo-audit.tgz" | sha256sum -c -
          tar -xzf "$dir/cargo-audit.tgz" -C "$dir" --strip-components=1 "${name}/cargo-audit"
          "$dir/cargo-audit" --version
          echo "$dir" >> "$GITHUB_PATH"

      # cargo-audit's own fetch has no retry; clone the advisory database here, with retries,
      # and audit against that copy offline.
      - name: Fetch the RustSec advisory database
        if: steps.scope.outputs.run == 'true'
        run: |
          set -euo pipefail
          db="$RUNNER_TEMP/advisory-db"
          for attempt in 1 2 3 4 5; do
            rm -rf "$db"
            if git clone --quiet --depth 1 https://github.com/rustsec/advisory-db.git "$db"; then
              git -C "$db" log -1 --format='advisory-db %H (%cI)'
              echo "ADVISORY_DB=$db" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "::warning::advisory-db clone attempt $attempt failed"
            sleep $((attempt * 10))
          done
          echo "::error::could not fetch the RustSec advisory database"
          exit 1

      # Yanked-crate lookups query the crates.io index per crate and are left out: they
      # aren't advisories, and a registry hiccup shouldn't fail the check.
      - name: Audit Rust crates (Cargo.lock)
        if: steps.scope.outputs.run == 'true'
        run: cargo-audit audit --no-fetch --no-yanked --db "$ADVISORY_DB" --file Cargo.lock

      - name: Audit huddle gateway runtime dependencies
        if: steps.scope.outputs.run == 'true'
        working-directory: huddle-gateway
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/npm-audit.json"
          # npm audit exits 1 both for findings and for registry errors. Retry until the
          # registry answers with a report, then judge the report itself.
          for attempt in 1 2 3 4 5; do
            npm audit --omit=dev --json > "$report" || true
            if jq -e '.metadata.vulnerabilities.total | numbers' "$report" > /dev/null 2>&1; then
              break
            fi
            echo "::warning::npm audit attempt $attempt returned no report"
            cat "$report" || true
            rm -f "$report"
            sleep $((attempt * 10))
          done
          test -s "$report" || { echo "::error::the npm registry returned no audit report"; exit 1; }
          jq -r '.metadata.vulnerabilities | to_entries | map("\(.key)=\(.value)") | join(" ")' "$report"
          if ! jq -e '.metadata.vulnerabilities.total == 0' "$report" > /dev/null; then
            jq -r '.vulnerabilities[] | "::error::\(.name) (\(.severity)): \([.via[] | if type == "object" then .url else . end] | join(", "))"' "$report"
            exit 1
          fi
