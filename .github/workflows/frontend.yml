name: Frontend

# The required Frontend job reports on every PR and main push. It runs typecheck, lint,
# Vitest and a production build for frontend inputs, then embeds that dist in crates/spa.
# The mock e2e server uses Vite and the in-memory backend; it does not compile Rust.
# Three advisory browser shards run only when those inputs change.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions: {}

# A new push to a pull request supersedes the run for its previous commit.
# Other runs have unique groups so main keeps both queued and running jobs.
concurrency:
  group: frontend-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    outputs:
      run: ${{ steps.scope.outputs.run }}
    defaults:
      run:
        working-directory: frontend
    steps:
      # The history is for the PR diff; blobs are fetched only for the sparse paths checked out.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
          # Cone mode also brings the root's files (Cargo.toml, Cargo.lock, rust-toolchain.toml).
          sparse-checkout: |
            frontend
            .github/workflows/frontend.yml
            .github/scripts
            crates
            .cargo
            vectors

      - name: Decide whether the frontend checks are needed
        id: scope
        working-directory: .
        env:
          PATTERN: '^(frontend/|crates/spa/|crates/api_types/|\.github/workflows/frontend\.yml$|\.github/scripts/)'
        run: python3 .github/scripts/check-paths.py

      - name: Set up Node
        if: steps.scope.outputs.run == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      # The pnpm version comes from frontend/package.json's packageManager field.
      - name: Set up pnpm
        if: steps.scope.outputs.run == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
          cache: true
          cache_dependency_path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        if: steps.scope.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      - name: Biome
        if: steps.scope.outputs.run == 'true'
        run: pnpm exec biome ci

      - name: Anti-slop (Oxlint)
        if: steps.scope.outputs.run == 'true'
        run: pnpm lint:anti-slop

      - name: Type-check (tsc)
        if: steps.scope.outputs.run == 'true'
        run: pnpm typecheck

      - name: Unit tests (Vitest)
        if: steps.scope.outputs.run == 'true'
        run: pnpm test

      - name: Build (vite build)
        if: steps.scope.outputs.run == 'true'
        run: pnpm build

      # Vite's manifest names the entry chunks and the chunks they import statically, i.e. what a
      # first visit downloads; each is reported with its CSS. Lazy chunks are left out.
      - name: Report bundle sizes
        if: steps.scope.outputs.run == 'true'
        run: |
          set -euo pipefail
          {
            echo "### Frontend bundle (initial load: entry chunks and their static imports)"
            echo
            echo "| File | Size | gzip -9 |"
            echo "| --- | ---: | ---: |"
            total=0
            while IFS= read -r file; do
              raw=$(wc -c < "dist/$file")
              gz=$(gzip -9 -c "dist/$file" | wc -c)
              total=$((total + gz))
              printf '| <code>%s</code> | %s B | %s B |\n' "$file" "$raw" "$gz"
            done < <(jq -r '
              . as $m
              | def walk($seen; $todo):
                  if ($todo | length) == 0 then $seen
                  elif ($seen | index([$todo[0]])) then walk($seen; $todo[1:])
                  else walk($seen + [$todo[0]]; $todo[1:] + ($m[$todo[0]].imports // []))
                  end;
                walk([]; [to_entries[] | select(.value.isEntry) | .key])
              | map($m[.] | .file, (.css // [])[])
              | unique[]' dist/.vite/manifest.json)
            printf '| **Total** | | **%s B** |\n' "$total"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # The nightly and components rust-toolchain.toml pins, as everywhere else in CI.
      - name: Set up Rust
        if: steps.scope.outputs.run == 'true'
        working-directory: .
        run: rustup toolchain install && rustc -vV

      # crates/spa's build script embeds the dist just built (an SPA_DIST without an index.html
      # fails the build); its tests check the embedded table, encodings and the shell against it.
      - name: Embed the build (cargo test -p campfire_spa)
        if: steps.scope.outputs.run == 'true'
        working-directory: .
        env:
          SPA_DIST: frontend/dist
          CARGO_TERM_COLOR: always
        run: cargo test -p campfire_spa --locked -j 4

      # The runner image usually has the shell's system libraries (it ships Chrome). Fetching
      # them with apt only when the shell can't start keeps a slow mirror off the critical path.
      - name: Install the preview browser
        if: steps.scope.outputs.run == 'true'
        run: |
          set -euo pipefail
          pnpm exec playwright install --only-shell chromium
          if ! node -e "require('@playwright/test').chromium.launch().then((browser) => browser.close())"; then
            echo "The headless shell can't start yet; installing its system libraries."
            pnpm exec playwright install-deps chromium
          fi

      - name: Playwright (production preview and installed app)
        if: steps.scope.outputs.run == 'true'
        env:
          PLAYWRIGHT_HTML_OPEN: never
        run: pnpm test:e2e

      - name: Keep a failed preview report
        if: ${{ failure() && steps.scope.outputs.run == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-preview-report
          path: |
            frontend/playwright-report/
            frontend/test-results-preview/
          retention-days: 14
          if-no-files-found: ignore

  # Each shard owns one mock server and runs one browser worker.
  e2e:
    needs: frontend
    if: needs.frontend.outputs.run == 'true'
    name: Frontend e2e (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [ 1, 2, 3 ]
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          persist-credentials: false
          sparse-checkout: |
            frontend
            .github/workflows/frontend.yml
            .github/scripts

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      # The pnpm version comes from frontend/package.json's packageManager field.
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
          cache: true
          cache_dependency_path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The installed @playwright/test, as the lockfile resolved it, names the browser build.
      - name: Resolve the Playwright version
        id: playwright
        run: |
          set -euo pipefail
          version="$(pnpm exec playwright --version | awk '{ print $2 }')"
          echo "Playwright $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore the Playwright browser
        id: browser-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-chromium-headless-shell

      # The specs run headless, so Chromium's headless shell is the only browser they launch. Its
      # system libraries come with the runner image; apt runs only when the shell can't start,
      # because a slow mirror once spent six minutes of the job's fifteen there.
      - name: Install the Playwright browser
        run: |
          set -euo pipefail
          pnpm exec playwright install --only-shell chromium
          if ! node -e "require('@playwright/test').chromium.launch().then((browser) => browser.close())"; then
            echo "The headless shell can't start yet; installing its system libraries."
            pnpm exec playwright install-deps chromium
          fi

      - name: Save the Playwright browser
        if: ${{ matrix.shard == 1 && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.browser-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.browser-cache.outputs.cache-primary-key }}

      - name: Playwright (mock backend)
        env:
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
          PLAYWRIGHT_HTML_OPEN: never
        run: pnpm exec playwright test -c playwright.mock.config.ts --fully-parallel --shard="$SHARD" --reporter=line,html

      # The production build can order CSS differently from the dev server (shared chunks' sheets
      # link ahead of the entry's), so the layout checks run against `vite build` too.
      - name: Playwright (mock backend, production build)
        if: ${{ matrix.shard == 1 }}
        env:
          SMARTFIRE_E2E_BUILD: "1"
          PLAYWRIGHT_HTML_OPEN: never
        run: pnpm exec playwright test -c playwright.mock.config.ts e2e/mock/inline-layout.spec.ts --reporter=line,html

      # The HTML report carries each failed test's trace (trace: retain-on-failure).
      - name: Keep the report of a failed run
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14
          if-no-files-found: ignore
