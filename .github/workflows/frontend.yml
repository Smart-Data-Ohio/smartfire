name: Frontend

# The React SPA in frontend/: Biome, the vendored anti-slop Oxlint rules, tsc, Vitest and a
# production build, with the entry chunks' gzip sizes in the job summary; then crates/spa's tests
# with that build embedded. Rust's PWA correctness suite also embeds the production dist;
# ordinary rust.yml jobs use the stub page, and the image builds on main.
#
# "Frontend" reports on every pull request so it can be a required check: a PR that touches
# none of frontend/, crates/api_types (whose generated types the schemas in frontend/src/api are
# pinned to), crates/spa and this workflow passes after the scope step, without installing
# anything. The check that frontend/src/gen matches crates/api_types runs in rust.yml's clippy job.
# Pushes to main always run everything, and so does a PR whose diff can't be read.
#
# This workflow only checks: read-only contents permission, no secrets, nothing published.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions: {}

# A new push to a pull request supersedes the run for its previous commit.
# Other runs have unique groups so main keeps both queued and running jobs.
concurrency:
  group: frontend-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      # The history is for the PR diff; blobs are fetched only for the sparse paths checked out.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
          filter: blob:none
          persist-credentials: false
          # Cone mode also brings the root's files (Cargo.toml, Cargo.lock, rust-toolchain.toml).
          sparse-checkout: |
            frontend
            .github/workflows/frontend.yml
            crates
            .cargo
            vectors

      - name: Decide whether the frontend checks are needed
        id: scope
        working-directory: .
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          run=true
          if [ "$EVENT" = pull_request ]; then
            if paths="$(git diff --no-renames --name-only "$BASE...$HEAD" --)"; then
              if [ -n "$paths" ] && ! grep -qE '^(frontend/|crates/api_types/|crates/spa/|\.github/workflows/frontend\.yml$)' <<< "$paths"; then
                run=false
              fi
            else
              echo "::warning::PR diff unavailable; running the frontend checks."
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          if [ "$run" = true ]; then
            echo "Run the frontend checks"
          else
            echo "No frontend inputs changed: nothing to check" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up Node
        if: steps.scope.outputs.run == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      # The pnpm version comes from frontend/package.json's packageManager field.
      - name: Set up pnpm
        if: steps.scope.outputs.run == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
          cache: true
          cache_dependency_path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        if: steps.scope.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      - name: Biome
        if: steps.scope.outputs.run == 'true'
        run: pnpm exec biome ci

      - name: Anti-slop (Oxlint)
        if: steps.scope.outputs.run == 'true'
        run: pnpm lint:anti-slop

      - name: Type-check (tsc)
        if: steps.scope.outputs.run == 'true'
        run: pnpm typecheck

      - name: Unit tests (Vitest)
        if: steps.scope.outputs.run == 'true'
        run: pnpm test

      - name: Build (vite build)
        if: steps.scope.outputs.run == 'true'
        run: pnpm build

      # Vite's manifest names the entry chunks and the chunks they import statically, i.e. what a
      # first visit downloads; each is reported with its CSS. Lazy chunks are left out.
      - name: Report bundle sizes
        if: steps.scope.outputs.run == 'true'
        run: |
          set -euo pipefail
          {
            echo "### Frontend bundle (initial load: entry chunks and their static imports)"
            echo
            echo "| File | Size | gzip -9 |"
            echo "| --- | ---: | ---: |"
            total=0
            while IFS= read -r file; do
              raw=$(wc -c < "dist/$file")
              gz=$(gzip -9 -c "dist/$file" | wc -c)
              total=$((total + gz))
              printf '| <code>%s</code> | %s B | %s B |\n' "$file" "$raw" "$gz"
            done < <(jq -r '
              . as $m
              | def walk($seen; $todo):
                  if ($todo | length) == 0 then $seen
                  elif ($seen | index([$todo[0]])) then walk($seen; $todo[1:])
                  else walk($seen + [$todo[0]]; $todo[1:] + ($m[$todo[0]].imports // []))
                  end;
                walk([]; [to_entries[] | select(.value.isEntry) | .key])
              | map($m[.] | .file, (.css // [])[])
              | unique[]' dist/.vite/manifest.json)
            printf '| **Total** | | **%s B** |\n' "$total"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # The nightly and components rust-toolchain.toml pins, as everywhere else in CI.
      - name: Set up Rust
        if: steps.scope.outputs.run == 'true'
        working-directory: .
        run: rustup toolchain install && rustc -vV

      # crates/spa's build script embeds the dist just built (an SPA_DIST without an index.html
      # fails the build); its tests check the embedded table, encodings and the shell against it.
      - name: Embed the build (cargo test -p campfire_spa)
        if: steps.scope.outputs.run == 'true'
        working-directory: .
        env:
          SPA_DIST: frontend/dist
          CARGO_TERM_COLOR: always
        run: cargo test -p campfire_spa --locked -j 4

      # The runner image usually has the shell's system libraries (it ships Chrome). Fetching
      # them with apt only when the shell can't start keeps a slow mirror off the critical path.
      - name: Install the preview browser
        if: steps.scope.outputs.run == 'true'
        run: |
          set -euo pipefail
          pnpm exec playwright install --only-shell chromium
          if ! node -e "require('@playwright/test').chromium.launch().then((browser) => browser.close())"; then
            echo "The headless shell can't start yet; installing its system libraries."
            pnpm exec playwright install-deps chromium
          fi

      - name: Playwright (production preview and installed app)
        if: steps.scope.outputs.run == 'true'
        env:
          PLAYWRIGHT_HTML_OPEN: never
        run: pnpm test:e2e

      - name: Keep a failed preview report
        if: ${{ failure() && steps.scope.outputs.run == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-preview-report
          path: |
            frontend/playwright-report/
            frontend/test-results-preview/
          retention-days: 14
          if-no-files-found: ignore

  # The mock Playwright suite (frontend/e2e/mock, playwright.mock.config.ts): the SPA on Vite's dev
  # server with the in-memory mock backend, in Chromium. The config runs one worker against one
  # mock server, so the suite is split across jobs, each with its own server, by test
  # (--fully-parallel only changes how --shard splits it; each job still runs one test at a time).
  #
  # Not a required check, and "Frontend" doesn't need it: each shard reports as
  # "Frontend e2e (i/n)". It runs when frontend/ or this workflow changes (a crates/api_types
  # change the SPA sees comes with its regenerated frontend/src/gen), on every push to main, and
  # when the PR diff can't be read. The browser is cached per Playwright version, saved from main.
  # Six shards keep each one well inside the 15-minute timeout as the phone specs grow; at four,
  # shards ran 12-15 minutes and the slowest were cancelled mid-run.
  e2e:
    name: Frontend e2e (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [ 1, 2, 3, 4, 5, 6 ]
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
          filter: blob:none
          persist-credentials: false
          sparse-checkout: |
            frontend
            .github/workflows/frontend.yml

      - name: Decide whether the e2e suite is needed
        id: scope
        working-directory: .
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          run=true
          if [ "$EVENT" = pull_request ]; then
            if paths="$(git diff --no-renames --name-only "$BASE...$HEAD" --)"; then
              if [ -n "$paths" ] && ! grep -qE '^(frontend/|\.github/workflows/frontend\.yml$)' <<< "$paths"; then
                run=false
              fi
            else
              echo "::warning::PR diff unavailable; running the e2e suite."
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          if [ "$run" = true ]; then
            echo "Run the e2e suite"
          else
            echo "No frontend changes: no e2e run" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up Node
        if: steps.scope.outputs.run == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      # The pnpm version comes from frontend/package.json's packageManager field.
      - name: Set up pnpm
        if: steps.scope.outputs.run == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
          cache: true
          cache_dependency_path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        if: steps.scope.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      # The installed @playwright/test, as the lockfile resolved it, names the browser build.
      - name: Resolve the Playwright version
        id: playwright
        if: steps.scope.outputs.run == 'true'
        run: |
          set -euo pipefail
          version="$(pnpm exec playwright --version | awk '{ print $2 }')"
          echo "Playwright $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore the Playwright browser
        id: browser-cache
        if: steps.scope.outputs.run == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-chromium-headless-shell

      # The specs run headless, so Chromium's headless shell is the only browser they launch. Its
      # system libraries come with the runner image; apt runs only when the shell can't start,
      # because a slow mirror once spent six minutes of the job's fifteen there.
      - name: Install the Playwright browser
        if: steps.scope.outputs.run == 'true'
        run: |
          set -euo pipefail
          pnpm exec playwright install --only-shell chromium
          if ! node -e "require('@playwright/test').chromium.launch().then((browser) => browser.close())"; then
            echo "The headless shell can't start yet; installing its system libraries."
            pnpm exec playwright install-deps chromium
          fi

      - name: Save the Playwright browser
        if: ${{ steps.scope.outputs.run == 'true' && matrix.shard == 1 && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.browser-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.browser-cache.outputs.cache-primary-key }}

      - name: Playwright (mock backend)
        if: steps.scope.outputs.run == 'true'
        env:
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
          PLAYWRIGHT_HTML_OPEN: never
        run: pnpm exec playwright test -c playwright.mock.config.ts --fully-parallel --shard="$SHARD" --reporter=line,html

      # The production build can order CSS differently from the dev server (shared chunks' sheets
      # link ahead of the entry's), so the layout checks run against `vite build` too.
      - name: Playwright (mock backend, production build)
        if: ${{ steps.scope.outputs.run == 'true' && matrix.shard == 1 }}
        env:
          SMARTFIRE_E2E_BUILD: "1"
          PLAYWRIGHT_HTML_OPEN: never
        run: pnpm exec playwright test -c playwright.mock.config.ts e2e/mock/inline-layout.spec.ts --reporter=line,html

      # The HTML report carries each failed test's trace (trace: retain-on-failure).
      - name: Keep the report of a failed run
        if: ${{ failure() && steps.scope.outputs.run == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14
          if-no-files-found: ignore
