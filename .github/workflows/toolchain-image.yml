name: Toolchain image

on:
  push:
    branches: [ main ]
    # ci/toolchain-inputs.py --files lists the toolchain's current context inputs.
    # Add new copied scripts or patches here when extending that stage.
    paths:
      - Dockerfile
      - rust-toolchain.toml
      - .dockerignore
      - ci/toolchain-inputs.py
      - .github/workflows/toolchain-image.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: toolchain-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  toolchain:
    # Only the reviewed main checkout may write the shared image, including manual runs.
    if: github.ref == 'refs/heads/main' && github.repository == 'Smart-Data-Ohio/smartfire'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Hash toolchain inputs
        id: inputs
        run: echo "hash=$(python3 ci/toolchain-inputs.py)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for the published inputs
        id: existing
        env:
          REFERENCE: ghcr.io/smart-data-ohio/smartfire-toolchain:${{ steps.inputs.outputs.hash }}
        run: |
          set -euo pipefail
          # Avoid rebuilding for production-only Dockerfile changes or repeated dispatches.
          if docker manifest inspect "$REFERENCE" > /dev/null; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.existing.outputs.exists != 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1

      - name: Build and publish the toolchain
        if: steps.existing.outputs.exists != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          target: toolchain
          build-args: BASE_REGISTRY=mirror.gcr.io
          platforms: linux/amd64
          tags: ghcr.io/smart-data-ohio/smartfire-toolchain:${{ steps.inputs.outputs.hash }}
          labels: org.opencontainers.image.source=https://github.com/Smart-Data-Ohio/smartfire
          push: true
          provenance: false
          sbom: false
