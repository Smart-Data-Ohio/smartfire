    name: Rust correctness (${{ matrix.suite }})
    needs: [source, changes, correctness-image, correctness-tests]
    if: needs.changes.outputs.pages == 'true' && inputs.scope != 'messaging-and-browsers'
    runs-on: ubuntu-latest
    env:
      CI_SOURCE_SHA: ${{ needs.source.outputs.sha }}
    permissions:
      contents: read
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        suite: [livekit]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - name: Prepare shared Rust CI inputs
        uses: ./.github/actions/rust-setup # zizmor: ignore[self-repository] -- setup must follow the selected checkout, including a manual PR ref
        with:
          parity: seeds
          toolchain: 'false'
      - name: Collect the correctness test harness
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: rust-browser-test-build-${{ needs.source.outputs.sha }}
          path: target
      - name: Collect pinned correctness prerequisites
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: rust-messaging-prerequisites-image-${{ needs.source.outputs.sha }}
          path: ${{ runner.temp }}/prerequisites
      - name: Load pinned correctness prerequisites
        run: |
          python3 ci/artifact_provenance.py verify "$RUNNER_TEMP/prerequisites/correctness-image.tar.zst" --head "$CI_SOURCE_SHA"
          zstd -dc "$RUNNER_TEMP/prerequisites/correctness-image.tar.zst" | docker load
      - name: Verify the correctness test harness
        run: python3 ci/artifact_provenance.py verify target/correctness-tests.tar.zst --head "$CI_SOURCE_SHA"
      - name: Run prerequisite-backed correctness suite
        env:
          CORRECTNESS_ARCHIVE: ${{ github.workspace }}/target/correctness-tests.tar.zst
          SUITE: ${{ matrix.suite }}
        run: bash ci/exec.sh bash ci/correctness.sh "$SUITE"
      - name: Retain correctness receipts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          overwrite: true
          name: rust-correctness-livekit-${{ needs.source.outputs.sha }}
          path: target/ci-receipts/
          if-no-files-found: error

  correctness-gate:
    name: Rust correctness
    needs: [source, changes, seeds, correctness, correctness-app, correctness-image, correctness-tests, correctness-browsers, correctness-drive, correctness-livekit, messaging-hosts, correctness-messaging]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    env:
      CI_SOURCE_SHA: ${{ needs.source.outputs.sha }}
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Require successful source resolution
        env:
          SOURCE_RESULT: ${{ needs.source.result }}
        run: test "$SOURCE_RESULT" = success

      - name: Require successful change detection
        env:
          CHANGE_RESULT: ${{ needs.changes.result }}
        run: test "$CHANGE_RESULT" = success

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false

      - name: Require every job to be gated
        run: python3 ci/check_gate_needs.py .github/workflows/rust.yml

      # No page inputs: every page job must be skipped; seeds follow the ordinary Rust scope.
      # The correctness matrix is also skipped for a manual messaging-and-browsers check.
      - name: Gate on every correctness job
        env:
          NEEDS: ${{ toJSON(needs) }}
          RUST: ${{ needs.changes.outputs.rust }}
          PAGES: ${{ needs.changes.outputs.pages }}
          PARTIAL: ${{ inputs.scope == 'messaging-and-browsers' }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          results = {job: value["result"] for job, value in json.loads(os.environ["NEEDS"]).items()}
          print("\n".join(f"{job}: {result}" for job, result in results.items()))
          if results.pop("source") != "success" or results.pop("changes") != "success" or any(os.environ[key] not in ("true", "false") for key in ("RUST", "PAGES")):
              sys.exit(1)
          seed_result = "success" if os.environ["RUST"] == "true" else "skipped"
          passed = results.pop("seeds") == seed_result
          for job, result in results.items():
              expected = "success" if os.environ["PAGES"] == "true" else "skipped"
              if job in ("correctness", "correctness-livekit") and os.environ["PARTIAL"] == "true":
                  expected = "skipped"
              passed = passed and result == expected
          if os.environ["PAGES"] == "false":
              print("No page inputs changed: the page suites were intentionally skipped.")
          sys.exit(not passed)
          PY

      - name: Collect correctness receipts
        if: needs.changes.outputs.pages == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: rust-correctness-*-${{ needs.source.outputs.sha }}
          path: ${{ runner.temp }}/receipts

      - name: Check that the shards cover every suite
        if: needs.changes.outputs.pages == 'true'
        env:
          SCOPE: ${{ inputs.scope || 'full' }}
        run: python3 ci/correctness_gate.py "$RUNNER_TEMP/receipts" --scope "$SCOPE" --head "$CI_SOURCE_SHA"
