name: Rust

# The Rust workspace at the repository root: clippy, binary build and tests, in the toolchain stage
# of the Dockerfile (the same libvips and ffmpeg builds as its image, so the storage vectors' byte
# checks run rather than skip). The app reads only its own inputs: web/ and fixtures/, and the seeds
# and recordings the original Rails app built once, which are committed and frozen.
#
# This workflow only checks: it has read-only contents permission, no secrets and no id-token, and
# nothing is pushed or published. Deploys stay behind the manual Deploy to GCP workflow, which
# requires a full main/nightly run for Rust candidates.
#
# Long suites run as parallel shards; a final job per gate ("Rust port", "Rust correctness")
# fails unless every shard succeeded and their receipts add up to the whole suite.

on:
  push:
    branches: [ main ]
  # Every pull request gets a "Rust port" result, so it can be a required check; the
  # changes job decides whether the PR touched anything the Rust gates read.
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "37 5 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to test (defaults to the workflow ref)
        type: string
        required: false
        default: ''
      scope:
        description: Jobs to run for this manual check
        type: choice
        required: false
        default: full
        options:
          - full
          - messaging-and-browsers

permissions: {}

# A new push to a pull request supersedes the run for its previous commit.
# Pushes to main are never cancelled, so every main commit keeps a full run.
concurrency:
  group: rust-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || inputs.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: "true"
  RUST_CI_IMAGE: campfire-toolchain
  RUST_CI_CONTAINER_PREFIX: campfire-ci
  # Dev/test builds compile the campfire crates with Cranelift (.cargo/config.toml), which can't
  # unwind, so these panic-recovery tests run in their own job with those crates on LLVM, as
  # production builds them (ci/llvm.toml; the ci-llvm nextest profile selects the app's crates).
  # The scheduled run tests the whole suite on LLVM.
  CAMPFIRE_LLVM: --config=ci/llvm.toml
  CAMPFIRE_LLVM_ONLY_TESTS: >-
    test(=channels::message_features::tests::origin_is_present_for_commit_callbacks_and_restored_after_errors_and_panics) |
    test(=controllers::agent_review_r5_tests::ws11_proxy_header_oracle_rejects_unapproved_changes) |
    test(=jobs::tests::a_panicking_ad_hoc_job_is_logged_and_its_worker_carries_on) |
    test(=test_support::server_startup_panics_reach_the_reporter_and_join_handle)

jobs:
  # Rust-relevant inputs: everything but docs/, deploy/, frontend/ (the SPA, checked by
  # frontend.yml), the other workflows and the root's prose files; the setup action and this
  # workflow count. A PR touching only those skips the build, and "Rust port" passes on that
  # intentional skip. Pushes, the nightly run, manual runs, empty
  # diffs and unavailable history all keep the full run.
  changes:
    name: Rust changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      rust: ${{ steps.scope.outputs.rust }}
    steps:
      - name: Checkout PR history
        id: history
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Decide whether Rust gates are needed
        id: scope
        env:
          HISTORY_OUTCOME: ${{ steps.history.outcome }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess

          # The workspace is the repository root, and the app reads only its own tree: docs,
          # deploy scripts, the SPA's sources (frontend/, which no crate reads yet), other
          # workflows and the root's prose files can't affect it. Any other path, including a new
          # top-level one, runs the gates.
          OUTSIDE = (b"docs/", b"deploy/", b"frontend/", b".github/")
          PROSE = (b"README.md", b"ROADMAP.md", b"CONTRIBUTING.md", b"SECURITY.md",
                   b"THIRD_PARTY_NOTICES.md", b"MIT-LICENSE")
          SETUP = (b".github/actions/rust-setup/",)
          FILES = (b".github/workflows/rust.yml",)

          def rust_input(path):
              if path.startswith(SETUP) or path in FILES:
                  return True
              return not (path.startswith(OUTSIDE) or path in PROSE)

          rust = True
          try:
              if os.environ["GITHUB_EVENT_NAME"] == "pull_request":
                  if os.environ["HISTORY_OUTCOME"] != "success":
                      print("::warning::PR history checkout unavailable; running the full Rust gates.")
                  else:
                      with open(os.environ["GITHUB_EVENT_PATH"]) as event_file:
                          pr = json.load(event_file)["pull_request"]
                      # Include both sides of renames. An empty diff keeps full coverage.
                      diff = subprocess.check_output([
                          "git", "diff", "--no-renames", "--name-only", "-z",
                          f'{pr["base"]["sha"]}...{pr["head"]["sha"]}', "--",
                      ])
                      paths = [path for path in diff.split(b"\0") if path]
                      rust = not paths or any(rust_input(path) for path in paths)
          except (OSError, KeyError, ValueError, TypeError, subprocess.CalledProcessError) as error:
              rust = True
              print(f"::warning::PR diff unavailable ({type(error).__name__}); running the full Rust gates.")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"rust={str(rust).lower()}\n")
          print("Run the Rust gates" if rust else "No Rust inputs changed: skip the Rust gates")
          PY

  # The committed default/first_run/agents_ui/ledger_originals seeds (parity/seeds/frozen), built
  # once by the Rails app: their manifest, keys and schema version match this checkout, and the
  # checker rejects changed, missing or out-of-date seeds. Every job restores them the same way.
  seeds:
    name: Rust seeds
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Prove the seed check rejects changed or missing seeds
        run: python3 -m unittest discover -s parity -p test_frozen_seeds.py

      - name: Check the committed seeds
        run: python3 parity/bin/frozen-seeds check

  # Every ordinary nextest test but the four LLVM-only ones (the llvm job), split round-robin
  # by nextest into twelve slices.
  test:
    name: Rust tests (${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.rust == 'true' && inputs.scope != 'messaging-and-browsers'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/12", "2/12", "3/12", "4/12", "5/12", "6/12", "7/12", "8/12", "9/12", "10/12", "11/12", "12/12"]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Prepare shared Rust CI inputs
        id: setup
        uses: ./.github/actions/rust-setup # zizmor: ignore[self-repository] -- setup must follow the selected checkout, including a manual PR ref
        with:
          parity: seeds
          cargo-cache: tests

      # Capture all failures and keep running; the explicit gate below then makes missing
      # seeds and failed tests fail the job.
      - name: Tests
        id: tests
        continue-on-error: true
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          status=0
          selection=(-E "not (rdeps(campfire_app) and ($CAMPFIRE_LLVM_ONLY_TESTS))")
          if [[ "$GITHUB_EVENT_NAME" == schedule ]]; then selection+=("$CAMPFIRE_LLVM"); fi
          bash ci/cargo.sh nextest run --locked --workspace --exclude html5ever \
            --profile ci -j 4 --no-fail-fast --no-tests fail --partition "slice:$SHARD" "${selection[@]}" 2>&1 |
            tee "$RUNNER_TEMP/nextest.log" || status=$?
          mkdir -p "$RUNNER_TEMP/results"
          cp target/nextest/ci/junit.xml "$RUNNER_TEMP/results/junit-${SHARD/\//of}.xml"
          exit "$status"

      # What the shards together, and the LLVM job, must run, listed from the harnesses compiled
      # above (no partition, so nothing rebuilds). `Rust port` checks the receipts against these.
      - name: List the tests the shards and the LLVM job must run
        if: ${{ !cancelled() && matrix.shard == '1/12' }}
        shell: bash
        run: |
          llvm=()
          if [[ "$GITHUB_EVENT_NAME" == schedule ]]; then llvm=("$CAMPFIRE_LLVM"); fi
          mkdir -p "$RUNNER_TEMP/results"
          # Each list names the same packages and profile its run does. The app's packages resolve
          # the same dependency features as --workspace, so the second list doesn't rebuild either.
          list() { bash ci/cargo.sh nextest list --locked --message-format json "${llvm[@]}" "$@"; }
          list --workspace --exclude html5ever --profile ci -E "not (rdeps(campfire_app) and ($CAMPFIRE_LLVM_ONLY_TESTS))" \
            > "$RUNNER_TEMP/results/list-shards.json"
          list -p campfire -p campfire_app --profile ci-llvm -E "$CAMPFIRE_LLVM_ONLY_TESTS" \
            > "$RUNNER_TEMP/results/list-llvm.json"

      # Lists ignored tests from the harnesses compiled above, with no partition or filter.
      - name: Enumerate compiled ignored tests
        if: ${{ !cancelled() && matrix.shard == '1/12' }}
        run: bash ci/verify-ignored.sh

      - name: Retain test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          overwrite: true
          name: rust-tests-${{ strategy.job-index }}
          path: ${{ runner.temp }}/results/
          if-no-files-found: error

      - name: Gate tests
        if: ${{ !cancelled() && steps.tests.outcome != 'success' }}
        run: |
          echo '::error::Rust tests failed; see the Tests step log.'
          exit 1

      - name: Keep only dependency artifacts for the cache
        if: ${{ matrix.shard == '1/12' && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.setup.outputs.cargo-cache-hit != 'true' }}
        run: python3 ci/prune-target.py target

      - name: Save cargo registry and target
        if: ${{ matrix.shard == '1/12' && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.setup.outputs.cargo-cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cargo-home/registry
            target
          key: ${{ steps.setup.outputs.cargo-cache-key }}

  clippy:
    name: Rust clippy, binaries and doctests
    needs: changes
    if: needs.changes.outputs.rust == 'true' && inputs.scope != 'messaging-and-browsers'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Check ignored-test coverage
        run: python3 -m unittest discover -s ci -p 'test_*.py'

      - name: Prepare shared Rust CI inputs
        id: setup
        uses: ./.github/actions/rust-setup # zizmor: ignore[self-repository] -- setup must follow the selected checkout, including a manual PR ref
        with:
          parity: seeds
          cargo-cache: build

      - name: Clippy
        run: bash ci/cargo.sh clippy --locked --workspace --exclude html5ever --all-targets -- -D warnings

      # The app has no integration-test target, so nextest builds its test harness but not its
      # normal executable. Retain that cfg(not(test))/link coverage, without building extra targets.
      - name: Build application binaries with production inputs
        run: bash ci/with-release-inputs.sh bash ./ci/cargo.sh build --locked --workspace --bins

      # nextest does not run doctests; database doctests remain part of the blocking gate.
      - name: Doctests (campfire_db)
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/results"
          bash ci/cargo.sh test --locked -p campfire_db --doc --no-fail-fast 2>&1 |
            tee "$RUNNER_TEMP/results/db-doc.log"

      - name: Doctests (other workspace)
        id: doctests
        continue-on-error: true
        shell: bash
        run: |
          bash ci/cargo.sh test --locked --workspace --exclude html5ever --exclude campfire_db \
            --doc --no-fail-fast 2>&1 | tee "$RUNNER_TEMP/results/workspace-doc.log"

      - name: Retain doctest logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          overwrite: true
          name: rust-doctests
          path: ${{ runner.temp }}/results/
          if-no-files-found: error

      - name: Gate workspace doctests
        if: ${{ !cancelled() && steps.doctests.outcome != 'success' }}
        run: |
          echo '::error::Workspace doctests failed; see the Doctests step log.'
          exit 1

      - name: Keep only dependency artifacts for the cache
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.setup.outputs.cargo-cache-hit != 'true' }}
        run: python3 ci/prune-target.py target

      - name: Save cargo registry and target
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.setup.outputs.cargo-cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cargo-home/registry
            target
          key: ${{ steps.setup.outputs.cargo-cache-key }}

  # The panic-recovery tests the shards leave out, with campfire built by LLVM.
  llvm:
    name: Rust tests (campfire panic recovery, LLVM)
    needs: changes
    if: needs.changes.outputs.rust == 'true' && inputs.scope != 'messaging-and-browsers'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Prepare shared Rust CI inputs
        uses: ./.github/actions/rust-setup # zizmor: ignore[self-repository] -- setup must follow the selected checkout, including a manual PR ref
        with:
          parity: seeds
          cargo-cache: tests

      - name: Tests (campfire panic recovery, LLVM)
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          status=0
          bash ci/cargo.sh nextest run --locked -p campfire -p campfire_app --profile ci-llvm -j 4 --no-fail-fast --no-tests fail \
            "$CAMPFIRE_LLVM" -E "$CAMPFIRE_LLVM_ONLY_TESTS" || status=$?
          mkdir -p "$RUNNER_TEMP/results"
          cp target/nextest/ci-llvm/junit.xml "$RUNNER_TEMP/results/junit-llvm.xml"
          exit "$status"

      - name: Retain test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          overwrite: true
          name: rust-tests-llvm
          path: ${{ runner.temp }}/results/
          if-no-files-found: error

      - name: Gate tests
        if: ${{ !cancelled() }}
        env:
          OUTCOME: ${{ steps.tests.outcome }}
        run: |
          python3 - "$RUNNER_TEMP/results/junit-llvm.xml" <<'PY'
          import os, sys, xml.etree.ElementTree as ET
          # The ci profile also reports the crate's #[ignore] tests, as skipped.
          ran = [c for c in ET.parse(sys.argv[1]).getroot().iter('testcase') if c.find('skipped') is None]
          passed = [c for c in ran if c.find('failure') is None and c.find('error') is None]
          print(f'{len(passed)} of {len(ran)} panic-recovery tests passed on LLVM')
          sys.exit(0 if os.environ['OUTCOME'] == 'success' and len(ran) == len(passed) == 4 else 1)
          PY

  # Production builds on the image's stable toolchain, not the nightly the tests use.
  # RUSTUP_TOOLCHAIN overrides rust-toolchain.toml, and Cargo runs from its scratch directory,
  # outside the workspace, so .cargo/config.toml's Cranelift settings don't apply; its check-mode
  # dependencies have their own `stable` Cargo cache.
  stable:
    name: Rust production toolchain check
    needs: changes
    if: needs.changes.outputs.rust == 'true' && inputs.scope != 'messaging-and-browsers'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Prepare shared Rust CI inputs
        id: setup
        uses: ./.github/actions/rust-setup # zizmor: ignore[self-repository] -- setup must follow the selected checkout, including a manual PR ref
        with:
          parity: none
          cargo-cache: stable

      # The release the Dockerfile's production stages build with (its RUST_VERSION).
      - name: Check with the production toolchain
        env:
          RUST_CI_WORKDIR: /ci-tmp
        shell: bash
        run: |
          RUSTUP_TOOLCHAIN=$(sed -nE 's/^ARG RUST_VERSION=([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' Dockerfile)
          [[ -n "$RUSTUP_TOOLCHAIN" ]] || { echo "::error::RUST_VERSION not found in Dockerfile"; exit 1; }
          echo "Production toolchain: $RUSTUP_TOOLCHAIN"
          export RUSTUP_TOOLCHAIN
          bash ci/cargo.sh check --locked --manifest-path /src/Cargo.toml --workspace --exclude html5ever

      - name: Keep only dependency artifacts for the cache
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.setup.outputs.cargo-cache-hit != 'true' }}
        run: python3 ci/prune-target.py target

      - name: Save cargo registry and target
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.setup.outputs.cargo-cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cargo-home/registry
            target
          key: ${{ steps.setup.outputs.cargo-cache-key }}

  rust:
    # Required by name in the branch ruleset, and deploy-gcp.yml looks this job up by name too.
    name: Rust port
    needs: [changes, seeds, test, clippy, llvm, stable]
    if: ${{ always() && inputs.scope != 'messaging-and-browsers' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Require successful change detection
        env:
          CHANGE_RESULT: ${{ needs.changes.result }}
        run: test "$CHANGE_RESULT" = success

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
          sparse-checkout: |
            ci
            .github/workflows

      - name: Require every job to be gated
        run: python3 ci/check_gate_needs.py .github/workflows/rust.yml

      - name: Collect test results
        if: ${{ needs.changes.outputs.rust == 'true' && (needs.test.result != 'skipped' || needs.clippy.result != 'skipped' || needs.llvm.result != 'skipped') }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: rust-{tests-*,doctests}
          path: ${{ runner.temp }}/results
          merge-multiple: true

      - name: Summarize tests
        if: needs.changes.outputs.rust == 'true'
        env:
          TEST_OUTCOME: ${{ needs.test.result }}
          DOC_OUTCOME: ${{ needs.clippy.result }}
        shell: bash
        run: |
          shopt -s nullglob
          args=()
          results="$RUNNER_TEMP/results"
          shards=("$results"/junit-*of12.xml)
          for path in "${shards[@]}" "$results/junit-llvm.xml"; do args+=(--junit "$path"); done
          args+=(--doc-log "$results/db-doc.log" --doc-log "$results/workspace-doc.log")
          # Each listed test passed exactly once, each #[ignore] test was reported, and libtest
          # accounted for every doctest; any difference fails this job.
          args+=(--expect "$results/list-shards.json" "${shards[@]}")
          args+=(--expect "$results/list-llvm.json" "$results/junit-llvm.xml")
          python3 ci/summarize-tests.py "${args[@]}"

      # When Rust inputs changed, every shard and prerequisite job must have succeeded:
      # failed, cancelled and skipped all fail this check. When none changed, every one of
      # them must have been skipped by that decision.
      - name: Gate on every Rust port job
        if: ${{ !cancelled() }}
        env:
          NEEDS: ${{ toJSON(needs) }}
          RUST: ${{ needs.changes.outputs.rust }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          results = {job: value["result"] for job, value in json.loads(os.environ["NEEDS"]).items()}
          print("\n".join(f"{job}: {result}" for job, result in results.items()))
          expected = "success" if os.environ["RUST"] == "true" else "skipped"
          if os.environ["RUST"] != "true":
              print("No Rust inputs changed: the Rust gates were intentionally skipped.")
          sys.exit(results.pop("changes") != "success"
                   or any(result != expected for result in results.values()))
          PY

  correctness:
    name: Rust correctness (${{ matrix.suite }})
    if: github.event_name != 'pull_request' && inputs.scope != 'messaging-and-browsers'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        suite: [acme, livekit, agents-ui]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Prepare shared Rust CI inputs
        uses: ./.github/actions/rust-setup # zizmor: ignore[self-repository] -- setup must follow the selected checkout, including a manual PR ref
        with:
          parity: seeds
          cargo-cache: correctness

      - name: Build pinned correctness prerequisites
        run: docker build --build-arg BASE_IMAGE=campfire-toolchain -f ci/Dockerfile -t campfire-correctness .

      - name: Run prerequisite-backed correctness suite
        env:
          SUITE: ${{ matrix.suite }}
        run: bash ci/exec.sh bash ci/correctness.sh "$SUITE"

      - name: Retain correctness receipts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          overwrite: true
          name: rust-correctness-${{ matrix.suite }}
          path: target/ci-receipts/
          if-no-files-found: error

  correctness-browsers:
    name: Rust correctness (browsers ${{ matrix.shard }})
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        suite: [browsers]
        shard: ["1/4", "2/4", "3/4", "4/4"]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Prepare shared Rust CI inputs
        id: setup
        uses: ./.github/actions/rust-setup # zizmor: ignore[self-repository] -- setup must follow the selected checkout, including a manual PR ref
        with:
          parity: seeds
          cargo-cache: correctness
      # The prerequisite image only adds browsers and tools to the toolchain image, so the
      # server binary and campfire's test harnesses (what correctness.sh builds first)
      # compile under the toolchain image meanwhile. Both images share the Cargo home and
      # target directory, so correctness.sh's own builds then find them fresh.
      - name: Build pinned correctness prerequisites while compiling
        env:
          RUST_CORRECTNESS_IMAGE: campfire-toolchain
        run: |
          bash ci/exec.sh bash -c 'cargo build --locked -p campfire --bin campfire &&
            cargo test --locked -p campfire --no-run -j 4' &
          compile=$!
          docker build --build-arg BASE_IMAGE=campfire-toolchain -f ci/Dockerfile -t campfire-correctness .
          wait "$compile"
      - name: Run prerequisite-backed correctness suite
        env:
          SUITE: ${{ matrix.suite }}
          CORRECTNESS_SHARD: ${{ matrix.shard }}
        run: bash ci/exec.sh bash ci/correctness.sh "$SUITE"
      - name: Retain correctness receipts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          overwrite: true
          name: rust-correctness-browsers-${{ strategy.job-index }}
          path: target/ci-receipts/
          if-no-files-found: error
      # Correctness builds run on the image's stable toolchain and LLVM (exec.sh), unlike the
      # test shards' nightly and Cranelift, so they keep their own cache of
      # dependency artifacts. This shard has built the server binary and campfire's test harness.
      - name: Keep only dependency artifacts for the cache
        if: ${{ matrix.shard == '2/4' && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.setup.outputs.cargo-cache-hit != 'true' }}
        run: python3 ci/prune-target.py target
      - name: Save cargo registry and target
        if: ${{ matrix.shard == '2/4' && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.setup.outputs.cargo-cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cargo-home/registry
            target
          key: ${{ steps.setup.outputs.cargo-cache-key }}

  # The paired messaging run's two Rust hosts, built once from this checkout with the same
  # commands behavior-check.py would run, then shared by every behaviour shard.
  messaging-hosts:
    name: Rust messaging host (${{ matrix.host }})
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        host: [app, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Prepare shared Rust CI inputs
        uses: ./.github/actions/rust-setup # zizmor: ignore[self-repository] -- setup must follow the selected checkout, including a manual PR ref
        with:
          parity: none
          cargo-cache: correctness

      - name: Build the application server
        if: ${{ matrix.host == 'app' }}
        env:
          RUST_CORRECTNESS_IMAGE: campfire-toolchain
        run: |
          bash ci/exec.sh cargo build --locked -j4 -p campfire --bin campfire
          tar -C target -cf "$RUNNER_TEMP/messaging-host.tar" debug/campfire

      # browser_host.py builds the generated paused-jobs test host in target/ws8bm-browser-host
      # and audits its includes; the restored registry dependencies move there with it.
      - name: Build the paused-jobs test host
        if: ${{ matrix.host == 'test' }}
        env:
          RUST_CORRECTNESS_IMAGE: campfire-toolchain
          WS8BM_HOST_BUILD_JOBS: 4
        shell: bash
        run: |
          mkdir -p target/ws8bm-browser-host
          if [[ -d target/debug ]]; then mv target/debug target/ws8bm-browser-host/debug; fi
          executable=$(bash ci/exec.sh python3 reference-tools/messaging/browser_host.py | tail -n 1)
          relative=${executable#"$GITHUB_WORKSPACE"/target/}
          [[ "$relative" != "$executable" && -x "$executable" ]] || { echo "::error::unexpected host path $executable"; exit 1; }
          echo "$relative" > target/ws8bm-browser-host/executable
          tar -C target -cf "$RUNNER_TEMP/messaging-host.tar" "$relative" \
            ws8bm-browser-host/executable ws8bm-browser-host/include-audit.json

      - name: Retain the host
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          overwrite: true
          name: rust-messaging-host-${{ matrix.host }}
          path: ${{ runner.temp }}/messaging-host.tar
          if-no-files-found: error
          retention-days: 1

      # The sixteen behaviour shards load this image rather than each building it (and
      # fetching its pinned packages) again.
      - name: Build and export pinned correctness prerequisites
        if: ${{ matrix.host == 'app' }}
        shell: bash
        run: |
          docker build --build-arg BASE_IMAGE=campfire-toolchain -f ci/Dockerfile -t campfire-correctness .
          docker save campfire-correctness | zstd -T0 -3 -q -o "$RUNNER_TEMP/correctness-image.tar.zst"

      - name: Retain the prerequisite image
        if: ${{ matrix.host == 'app' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          overwrite: true
          name: rust-messaging-prerequisites-image
          path: ${{ runner.temp }}/correctness-image.tar.zst
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  correctness-messaging:
    name: Rust correctness (messaging behaviour ${{ matrix.shard }})
    needs: messaging-hosts
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        suite: [messaging]
        shard: ["1/16", "2/16", "3/16", "4/16", "5/16", "6/16", "7/16", "8/16", "9/16", "10/16", "11/16", "12/16", "13/16", "14/16", "15/16", "16/16"]
    env:
      WS8BM_PREBUILT_APP: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Prepare shared Rust CI inputs
        uses: ./.github/actions/rust-setup # zizmor: ignore[self-repository] -- setup must follow the selected checkout, including a manual PR ref
        with:
          parity: seeds
          # The prerequisite image comes from the application host job.
          toolchain: 'false'
      - name: Collect the Rust hosts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: rust-messaging-host-*
          path: ${{ runner.temp }}/hosts
      - name: Install the Rust hosts
        shell: bash
        run: |
          mkdir -p target
          for host in app test; do tar -C target -xf "$RUNNER_TEMP/hosts/rust-messaging-host-$host/messaging-host.tar"; done
          echo "WS8BM_PREBUILT_TEST_HOST=$GITHUB_WORKSPACE/target/$(cat target/ws8bm-browser-host/executable)" >> "$GITHUB_ENV"
      - name: Collect pinned correctness prerequisites
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: rust-messaging-prerequisites-image
          path: ${{ runner.temp }}/prerequisites
      - name: Load pinned correctness prerequisites
        shell: bash
        run: zstd -dc "$RUNNER_TEMP/prerequisites/correctness-image.tar.zst" | docker load
      - name: Permit native browser namespaces
        run: |
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo apparmor_parser --replace ci/native-browser.apparmor
            echo 'RUST_CI_APPARMOR_PROFILE=campfire-ci-native' >> "$GITHUB_ENV"
          fi
      - name: Run prerequisite-backed correctness suite
        env:
          SUITE: ${{ matrix.suite }}
          CORRECTNESS_SHARD: ${{ matrix.shard }}
        run: bash ci/exec.sh bash ci/correctness.sh "$SUITE"
      - name: Retain correctness receipts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          overwrite: true
          name: rust-correctness-messaging-behavior-${{ strategy.job-index }}
          path: target/ci-receipts/
          if-no-files-found: error

  # The Drive attachment, share and sudo browser declarations (ignored-tests.json "drive"), each
  # on its own app with pinned Chromium.
  correctness-drive:
    name: Rust correctness (drive browsers)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        suite: [drive]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Prepare shared Rust CI inputs
        uses: ./.github/actions/rust-setup # zizmor: ignore[self-repository] -- setup must follow the selected checkout, including a manual PR ref
        with:
          parity: seeds
          cargo-cache: correctness
      - name: Build pinned correctness prerequisites
        run: docker build --build-arg BASE_IMAGE=campfire-toolchain -f ci/Dockerfile -t campfire-correctness .
      - name: Run prerequisite-backed correctness suite
        env:
          SUITE: ${{ matrix.suite }}
        run: bash ci/exec.sh bash ci/correctness.sh "$SUITE"
      - name: Retain correctness receipts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          overwrite: true
          name: rust-correctness-drive
          path: target/ci-receipts/
          if-no-files-found: error

  correctness-gate:
    name: Rust correctness
    needs: [seeds, correctness, correctness-browsers, correctness-drive, messaging-hosts, correctness-messaging]
    if: ${{ always() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Require every job to be gated
        run: python3 ci/check_gate_needs.py .github/workflows/rust.yml

      # The correctness matrix is skipped, not failed, for a messaging-and-browsers check.
      - name: Gate on every correctness job
        env:
          NEEDS: ${{ toJSON(needs) }}
          PARTIAL: ${{ inputs.scope == 'messaging-and-browsers' }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          results = {job: value["result"] for job, value in json.loads(os.environ["NEEDS"]).items()}
          print("\n".join(f"{job}: {result}" for job, result in results.items()))
          allowed = lambda job, result: result == "success" or (os.environ["PARTIAL"] == "true" and job == "correctness" and result == "skipped")
          sys.exit(not all(allowed(job, result) for job, result in results.items()))
          PY

      - name: Collect correctness receipts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: rust-correctness-*
          path: ${{ runner.temp }}/receipts

      - name: Check that the shards cover every suite
        env:
          SCOPE: ${{ inputs.scope || 'full' }}
        run: python3 ci/correctness_gate.py "$RUNNER_TEMP/receipts" --scope "$SCOPE" --head "$(git rev-parse HEAD)"
