name: Rust

# The Rust port in rust/: clippy, binary build and tests, in the toolchain stage of rust/Dockerfile (the
# same libvips and ffmpeg builds as its image, so the storage vectors' byte checks run rather than
# skip). The whole repository is mounted, so rust/.. is the Rails app the port reads as its
# reference (assets, fixtures, schema).
#
# This workflow only checks: it has read-only contents permission, no secrets and no id-token, and
# nothing is pushed or published. Deploys stay behind the manual Deploy to GCP workflow, which
# requires a full main/nightly run for Rust candidates.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    paths:
      - "rust/**"
      - "app/**"
      - "config/**"
      - "lib/**"
      - "test/**"
      - "db/**"
      - "public/**"
      - "vendor/**"
      - "bin/**"
      - "script/**"
      - "Gemfile*"
      - ".ruby-version"
      - "Dockerfile"
      - ".github/workflows/rust.yml"
      - ".github/actions/rust-setup/**"
  schedule:
    - cron: "37 5 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to test (defaults to the workflow ref)
        type: string
        required: false
        default: ''
      scope:
        description: Jobs to run for this manual check
        type: choice
        required: false
        default: full
        options:
          - full
          - messaging-and-browsers

permissions: {}

# A new push to a pull request supersedes the run for its previous commit.
# Pushes to main are never cancelled, so every main commit keeps a full run.
concurrency:
  group: rust-${{ github.event_name == 'pull_request' && github.head_ref || inputs.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    # Not "test": ci.yml's required checks match jobs by name, and this one mustn't stand in for them.
    name: Rust port
    if: inputs.scope != 'messaging-and-browsers'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 90
    env:
      CI: "true"
      RUST_CI_IMAGE: campfire-toolchain
      RUST_CI_CONTAINER_PREFIX: campfire-ci
      # Dev/test builds compile campfire with Cranelift (rust/.cargo/config.toml), which can't
      # unwind, so these panic-recovery tests run in their own step with campfire on LLVM, as
      # production builds it. The scheduled run tests the whole campfire suite on LLVM.
      CAMPFIRE_LLVM: --config=profile.dev.package.campfire.codegen-backend="llvm"
      CAMPFIRE_LLVM_ONLY_TESTS: >-
        test(=channels::message_features::tests::origin_is_present_for_commit_callbacks_and_restored_after_errors_and_panics) |
        test(=controllers::agent_review_r5_tests::ws11_proxy_header_oracle_rejects_unapproved_changes) |
        test(=jobs::tests::a_panicking_ad_hoc_job_is_logged_and_its_worker_carries_on) |
        test(=test_support::server_startup_panics_reach_the_reporter_and_join_handle)
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Check ignored-test coverage
        run: python3 -m unittest discover -s rust/ci -p 'test_*.py'

      - name: Prepare shared Rust CI inputs
        id: setup
        uses: ./.github/actions/rust-setup # zizmor: ignore[self-repository] -- setup must follow the selected checkout, including a manual PR ref
        with:
          save-caches: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'true' || 'false' }}

      - name: Clippy
        run: bash rust/ci/cargo.sh clippy --locked --workspace --exclude html5ever --all-targets -- -D warnings

      # Production builds on the image's stable toolchain, not the nightly the tests use. From the
      # repository root neither rust-toolchain.toml nor .cargo/config.toml applies; the separate
      # target dir keeps stable artifacts out of the cache.
      - name: Check with the production toolchain
        env:
          RUSTUP_TOOLCHAIN: "1.98.1"
          RUST_CI_WORKDIR: /src
          CARGO_TARGET_DIR: /ci-tmp/stable-target
        run: bash rust/ci/cargo.sh check --locked --manifest-path rust/Cargo.toml --workspace --exclude html5ever

      # The app has no integration-test target, so nextest builds its test harness but not its
      # normal executable. Retain that cfg(not(test))/link coverage, without building extra targets.
      - name: Build application binaries with production inputs
        run: bash rust/ci/with-release-inputs.sh bash ./ci/cargo.sh build --locked --workspace --bins

      - name: Enumerate compiled ignored tests
        run: bash rust/ci/verify-ignored.sh

      # Build with the same workspace/features as clippy and the following nextest run, then run
      # only the blocking database tests. The workspace filter below avoids executing them twice.
      - name: Tests (campfire_db)
        shell: bash
        run: |
          bash rust/ci/cargo.sh nextest run --locked --workspace --exclude html5ever \
            --profile ci -j 4 --no-fail-fast -E 'package(campfire_db)'
          cp rust/target/nextest/ci/junit.xml "$RUNNER_TEMP/db-junit.xml"
          # nextest does not run doctests; database doctests remain part of the blocking gate.
          bash rust/ci/cargo.sh test --locked -p campfire_db --doc --no-fail-fast 2>&1 |
            tee "$RUNNER_TEMP/db-doc.log"

      # Capture all failures and keep running the rest of the suite; the explicit gate
      # below then makes missing seeds and failed app tests fail the job.
      - name: Tests (seed-dependent campfire)
        id: app-tests
        continue-on-error: true
        shell: bash
        run: |
          status=0
          if [[ "$GITHUB_EVENT_NAME" == schedule ]]; then
            selection=(-E 'package(campfire)' "$CAMPFIRE_LLVM")
          else
            selection=(-E "package(campfire) and not ($CAMPFIRE_LLVM_ONLY_TESTS)")
          fi
          bash rust/ci/cargo.sh nextest run --locked --workspace --exclude html5ever \
            --profile ci -j 4 --no-fail-fast "${selection[@]}" 2>&1 |
            tee "$RUNNER_TEMP/campfire-nextest.log" || status=$?
          cp rust/target/nextest/ci/junit.xml "$RUNNER_TEMP/campfire-junit.xml"
          exit "$status"

      # Report the whole suite before promoting every failed outcome to job failure.
      - name: Tests (other workspace)
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          bash rust/ci/cargo.sh nextest run --locked --workspace --exclude html5ever \
            --profile ci -j 4 --no-fail-fast -E 'not package(campfire_db) and not package(campfire)' 2>&1 |
            tee "$RUNNER_TEMP/nextest.log"

      - name: Doctests (other workspace)
        id: doctests
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        continue-on-error: true
        shell: bash
        run: |
          bash rust/ci/cargo.sh test --locked --workspace --exclude html5ever --exclude campfire_db \
            --doc --no-fail-fast 2>&1 | tee "$RUNNER_TEMP/workspace-doc.log"

      - name: Summarize tests
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        env:
          TMPDIR: ${{ runner.temp }}
          TEST_OUTCOME: ${{ steps.tests.outcome == 'success' && steps.app-tests.outcome == 'success' && 'success' || 'failure' }}
          DOC_OUTCOME: ${{ steps.doctests.outcome }}
        run: |
          python3 -m unittest discover -s rust/ci -p 'test_*.py'
          python3 rust/ci/summarize-tests.py \
            --junit "$RUNNER_TEMP/db-junit.xml" --junit "$RUNNER_TEMP/campfire-junit.xml" --junit rust/target/nextest/ci/junit.xml \
            --doc-log "$RUNNER_TEMP/db-doc.log" --doc-log "$RUNNER_TEMP/workspace-doc.log"

      # After the summary, which reads the other workspace's junit.xml. Same target dir: only the
      # campfire crate rebuilds. The scheduled run already ran these with the whole suite.
      - name: Tests (campfire panic recovery, LLVM)
        if: ${{ !cancelled() && github.event_name != 'schedule' && steps.tests.outcome != 'skipped' }}
        shell: bash
        run: |
          bash rust/ci/cargo.sh nextest run --locked -p campfire --profile ci -j 4 --no-fail-fast \
            "$CAMPFIRE_LLVM" -E "package(campfire) and ($CAMPFIRE_LLVM_ONLY_TESTS)"
          python3 - rust/target/nextest/ci/junit.xml <<'PY'
          import sys, xml.etree.ElementTree as ET
          # The ci profile also reports the crate's #[ignore] tests, as skipped.
          ran = [c for c in ET.parse(sys.argv[1]).getroot().iter('testcase') if c.find('skipped') is None]
          passed = [c for c in ran if c.find('failure') is None and c.find('error') is None]
          print(f'{len(passed)} of {len(ran)} panic-recovery tests passed on LLVM')
          sys.exit(0 if len(ran) == len(passed) == 4 else 1)
          PY

      - name: Gate seed-dependent tests
        if: ${{ !cancelled() && steps.app-tests.outcome != 'success' }}
        run: |
          echo '::error::Seed-dependent campfire tests failed; see the campfire nextest log.'
          exit 1

      - name: Gate workspace tests and doctests
        if: ${{ !cancelled() && (steps.tests.outcome != 'success' || steps.doctests.outcome != 'success') }}
        run: |
          echo '::error::Workspace tests or doctests failed; see the test summary and logs.'
          exit 1

      - name: Save cargo registry and target
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.setup.outputs.cargo-cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            rust/.cargo-home/registry
            rust/target
          key: rust-cargo-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/Dockerfile', 'rust/Cargo.toml', 'rust/rust-toolchain.toml', 'rust/.cargo/config.toml', 'rust/ci/cargo.sh') }}-${{ hashFiles('rust/Cargo.lock') }}-${{ github.sha }}

  correctness:
    name: Rust correctness (${{ matrix.suite }})
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        suite: [database, acme, browsers, livekit, messaging, agents-ui]
        exclude: ${{ inputs.scope == 'messaging-and-browsers' && fromJSON('[{"suite":"database"},{"suite":"acme"},{"suite":"livekit"},{"suite":"agents-ui"}]') || fromJSON('[]') }}
    env:
      CI: "true"
      RUST_CI_IMAGE: campfire-toolchain
      RUST_CI_CONTAINER_PREFIX: campfire-ci
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
          # The external harnesses read original case bodies and the approved layout commit.
          fetch-depth: 0

      - name: Prepare shared Rust CI inputs
        uses: ./.github/actions/rust-setup # zizmor: ignore[self-repository] -- setup must follow the selected checkout, including a manual PR ref

      - name: Build pinned correctness prerequisites
        run: docker build --build-arg BASE_IMAGE=campfire-toolchain -f rust/ci/Dockerfile -t campfire-correctness rust

      - name: Permit native browser namespaces
        if: ${{ matrix.suite == 'messaging' }}
        run: |
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo apparmor_parser --replace rust/ci/native-browser.apparmor
            echo 'RUST_CI_APPARMOR_PROFILE=campfire-ci-native' >> "$GITHUB_ENV"
          fi

      - name: Run prerequisite-backed correctness suite
        env:
          SUITE: ${{ matrix.suite }}
        run: bash rust/ci/exec.sh bash rust/ci/correctness.sh "$SUITE"

      - name: Retain correctness receipts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rust-correctness-${{ matrix.suite }}
          path: rust/target/ci-receipts/
          if-no-files-found: error
