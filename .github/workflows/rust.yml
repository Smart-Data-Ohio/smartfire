name: Rust

# The Rust port in rust/: clippy, build and tests, in the toolchain stage of rust/Dockerfile (the
# same libvips and ffmpeg builds as its image, so the storage vectors' byte checks run rather than
# skip). The whole repository is mounted, so rust/.. is the Rails app the port reads as its
# reference (assets, fixtures, schema).

on:
  push:
    branches: [ main ]
    paths:
      - "rust/**"
      - ".github/workflows/rust.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "rust/**"
      - ".github/workflows/rust.yml"

permissions: {}

# A new push to a pull request supersedes the run for its previous commit.
# Pushes to main are never cancelled, so every main commit keeps a full run.
concurrency:
  group: rust-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The Dockerfile's toolchain stage: Rust with the image's own libvips and ffmpeg builds.
      - name: Build toolchain image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: rust
          file: rust/Dockerfile
          build-contexts: reference=.
          target: toolchain
          tags: campfire-toolchain
          load: true
          cache-from: type=gha,scope=rust-toolchain
          cache-to: type=gha,scope=rust-toolchain,mode=max

      - name: Cache cargo registry and target
        # zizmor: ignore[cache-poisoning] -- nothing is published: the image above is only loaded locally
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            rust/.cargo-home/registry
            rust/target
          key: rust-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: rust-cargo-

      - name: Clippy, build and tests
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            --volume "$PWD:/src" --workdir /src/rust \
            --env HOME=/tmp --env CARGO_HOME=/src/rust/.cargo-home --env CARGO_TERM_COLOR=always \
            campfire-toolchain sh -euc '
              cargo clippy --locked --workspace --exclude html5ever --all-targets -- -D warnings
              cargo build --locked --workspace
              cargo test --locked --workspace --exclude html5ever
            '
