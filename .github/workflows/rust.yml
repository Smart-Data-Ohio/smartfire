name: Rust

# The Rust port in rust/: clippy, build and tests, in the toolchain stage of rust/Dockerfile (the
# same libvips and ffmpeg builds as its image, so the storage vectors' byte checks run rather than
# skip). The whole repository is mounted, so rust/.. is the Rails app the port reads as its
# reference (assets, fixtures, schema).
#
# This workflow only checks: it has read-only contents permission, no secrets and no id-token, and
# nothing is pushed or published. Deploys stay behind the manual Deploy to GCP workflow, which
# looks only at ci.yml's runs.

on:
  push:
    branches: [ main ]
    paths:
      - "rust/**"
      - ".github/workflows/rust.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "rust/**"
      - ".github/workflows/rust.yml"
  # For checking the port against a Rails change the path filter doesn't see (app/assets,
  # app/javascript, config/importmap.rb, test/fixtures, db/schema.rb are all read by the port).
  workflow_dispatch:

permissions: {}

# A new push to a pull request supersedes the run for its previous commit.
# Pushes to main are never cancelled, so every main commit keeps a full run.
concurrency:
  group: rust-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    # Not "test": ci.yml's required checks match jobs by name, and this one mustn't stand in for them.
    name: Rust port
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 90
    env:
      # Only pushes to main write caches. The repository's Actions cache is shared with Rails CI and
      # the image builds, and a pull request's multi-gigabyte target directory would evict theirs.
      SAVE_CACHES: ${{ github.event_name == 'push' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The Dockerfile's toolchain stage: Rust with the image's own libvips and ffmpeg builds.
      - name: Build toolchain image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: rust
          file: rust/Dockerfile
          build-contexts: reference=.
          target: toolchain
          tags: campfire-toolchain
          load: true
          push: false
          cache-from: type=gha,scope=rust-toolchain
          cache-to: ${{ env.SAVE_CACHES == 'true' && 'type=gha,scope=rust-toolchain,mode=max' || '' }}

      - name: Restore cargo registry and target
        id: cargo-cache
        # zizmor: ignore[cache-poisoning] -- nothing is published: the image above is only loaded locally
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            rust/.cargo-home/registry
            rust/target
          key: rust-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: rust-cargo-

      - name: Clippy
        run: |
          docker run --rm --user "$(id -u):$(id -g)" --volume "$PWD:/src" --workdir /src/rust \
            --env HOME=/tmp --env CARGO_HOME=/src/rust/.cargo-home --env CARGO_TERM_COLOR=always \
            --env CARGO_INCREMENTAL=0 --env CARGO_PROFILE_DEV_DEBUG=line-tables-only \
            campfire-toolchain cargo clippy --locked --workspace --exclude html5ever --all-targets -- -D warnings

      - name: Build
        run: |
          docker run --rm --user "$(id -u):$(id -g)" --volume "$PWD:/src" --workdir /src/rust \
            --env HOME=/tmp --env CARGO_HOME=/src/rust/.cargo-home --env CARGO_TERM_COLOR=always \
            --env CARGO_INCREMENTAL=0 --env CARGO_PROFILE_DEV_DEBUG=line-tables-only \
            campfire-toolchain cargo build --locked --workspace

      # NON-BLOCKING until WS2 (schema port) lands, which re-enables this as a gate by removing
      # continue-on-error. The port's schema.sql, models and asset vectors are still stock
      # Campfire's while the reference (our fixtures, schema and assets) is Smartfire, so about 120
      # tests fail (`no such table: agent_credentials` and friends). The step still shows as failed
      # in the run, and the summary below counts the failures.
      - name: Tests (non-blocking until WS2)
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          docker run --rm --user "$(id -u):$(id -g)" --volume "$PWD:/src" --workdir /src/rust \
            --env HOME=/tmp --env CARGO_HOME=/src/rust/.cargo-home --env CARGO_TERM_COLOR=always \
            --env CARGO_INCREMENTAL=0 --env CARGO_PROFILE_DEV_DEBUG=line-tables-only \
            campfire-toolchain cargo test --locked --workspace --exclude html5ever --no-fail-fast 2>&1 |
            tee "$RUNNER_TEMP/cargo-test.log"

      - name: Summarize tests
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        shell: bash
        env:
          OUTCOME: ${{ steps.tests.outcome }}
        run: |
          log="$RUNNER_TEMP/cargo-test.log"
          read -r passed failed ignored < <(sed 's/\x1b\[[0-9;]*m//g' "$log" |
            awk '/^test result:/ { for (i = 1; i < NF; i++) { if ($(i+1) ~ /^passed/) p += $i; if ($(i+1) ~ /^failed/) f += $i; if ($(i+1) ~ /^ignored/) g += $i } }
                 END { print p + 0, f + 0, g + 0 }')
          {
            echo "### Rust tests (non-blocking until WS2)"
            echo
            echo "Outcome: **${OUTCOME}**. ${passed} passed, ${failed} failed, ${ignored} ignored."
            echo
            echo '```'
            sed 's/\x1b\[[0-9;]*m//g' "$log" | grep -A 20 -E '^error: [0-9]+ targets? failed' || echo "no failing targets"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$OUTCOME" != success ]; then
            echo "::warning title=Rust tests (non-blocking until WS2)::${failed} failed, ${passed} passed; see the Tests step's log"
          fi

      - name: Save cargo registry and target
        if: ${{ env.SAVE_CACHES == 'true' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            rust/.cargo-home/registry
            rust/target
          key: rust-cargo-${{ hashFiles('rust/Cargo.lock') }}
