name: Rust

# The Rust port in rust/: clippy, binary build and tests, in the toolchain stage of rust/Dockerfile (the
# same libvips and ffmpeg builds as its image, so the storage vectors' byte checks run rather than
# skip). The whole repository is mounted, so rust/.. is the Rails app the port reads as its
# reference (assets, fixtures, schema).
#
# This workflow only checks: it has read-only contents permission, no secrets and no id-token, and
# nothing is pushed or published. Deploys stay behind the manual Deploy to GCP workflow, which
# looks only at ci.yml's runs.

on:
  push:
    branches: [ main, ci/rust-speedups ]
    paths:
      - "rust/**"
      - ".github/workflows/rust.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "rust/**"
      - ".github/workflows/rust.yml"
  # For checking the port against a Rails change the path filter doesn't see (app/assets,
  # app/javascript, config/importmap.rb, test/fixtures, db/schema.rb are all read by the port).
  workflow_dispatch:

permissions: {}

# A new push to a pull request supersedes the run for its previous commit.
# Pushes to main are never cancelled, so every main commit keeps a full run.
concurrency:
  group: rust-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    # Not "test": ci.yml's required checks match jobs by name, and this one mustn't stand in for them.
    name: Rust port
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 90
    env:
      CI: "true"
      RUST_CI_IMAGE: campfire-toolchain
      RUST_CI_CONTAINER_PREFIX: campfire-ci
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test parity cache identities
        run: python3 -m unittest discover -s rust/parity -p test_ci_seed.py

      - name: Prepare pinned Rails reference
        id: parity
        shell: bash
        run: |
          echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"
          rust/parity/bin/ci-seed prepare >> "$GITHUB_OUTPUT"

      # Exact keys only: a seed from a different Rails pin, image input or seed script
      # is never reused. PRs can read trusted caches but cannot save either cache.
      - name: Restore reference image
        id: reference-cache
        # zizmor: ignore[cache-poisoning] -- loaded only for tests; PRs cannot save it or publish anything
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: rust/parity/.ci/image
          key: ${{ steps.parity.outputs.image_key }}-${{ runner.os }}-${{ runner.arch }}

      - name: Restore parity seeds
        id: seed-cache
        # zizmor: ignore[cache-poisoning] -- PRs cannot save it; Rails validates every restored seed
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            rust/parity/.seed/default
            rust/parity/.seed/first_run
          key: ${{ steps.parity.outputs.seed_key }}-${{ runner.os }}-${{ runner.arch }}

      - name: Build or load pinned reference image
        run: rust/parity/bin/ci-seed image

      - name: Build parity seeds
        if: ${{ steps.seed-cache.outputs.cache-hit != 'true' }}
        run: rust/parity/bin/ci-seed build

      - name: Validate parity seeds with Rails
        run: rust/parity/bin/ci-seed validate

      - name: Prove parity gates reject missing or corrupt inputs
        run: python3 -m unittest discover -s rust/parity -p test_ci_seed_docker.py

      # Only pushes to main save these caches; PRs and other branches only restore.
      - name: Save reference image
        if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main') && steps.reference-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: rust/parity/.ci/image
          key: ${{ steps.parity.outputs.image_key }}-${{ runner.os }}-${{ runner.arch }}

      - name: Save parity seeds
        if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main') && steps.seed-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            rust/parity/.seed/default
            rust/parity/.seed/first_run
          key: ${{ steps.parity.outputs.seed_key }}-${{ runner.os }}-${{ runner.arch }}

      - name: Summarize parity setup time
        env:
          STARTED: ${{ steps.parity.outputs.started }}
          IMAGE_HIT: ${{ steps.reference-cache.outputs.cache-hit }}
          SEED_HIT: ${{ steps.seed-cache.outputs.cache-hit }}
        run: |
          echo "Parity setup: $(($(date +%s) - STARTED))s (image cache: ${IMAGE_HIT:-false}; seed cache: ${SEED_HIT:-false})" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The Dockerfile's toolchain stage: Rust with the image's own libvips and ffmpeg builds.
      # Only pushes to main write caches. PRs and branch pushes may read but never write: this
      # prevents cache poisoning and keeps their multi-gigabyte targets from evicting Rails/image
      # caches. Use immutable GitHub context directly, never a step-writable environment variable.
      - name: Build toolchain image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: rust
          file: rust/Dockerfile
          build-contexts: reference=.
          target: toolchain
          tags: campfire-toolchain
          load: true
          push: false
          cache-from: type=gha,scope=rust-toolchain
          cache-to: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'type=gha,scope=rust-toolchain,mode=max' || '' }}

      - name: Restore cargo registry and target
        id: cargo-cache
        # zizmor: ignore[cache-poisoning] -- nothing is published: the image above is only loaded locally
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            rust/.cargo-home/registry
            rust/target
          key: rust-cargo-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/Dockerfile', 'rust/Cargo.toml', 'rust/ci/cargo.sh') }}-${{ hashFiles('rust/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            rust-cargo-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/Dockerfile', 'rust/Cargo.toml', 'rust/ci/cargo.sh') }}-${{ hashFiles('rust/Cargo.lock') }}-
            rust-cargo-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/Dockerfile', 'rust/Cargo.toml', 'rust/ci/cargo.sh') }}-

      - name: Clippy
        run: bash rust/ci/cargo.sh clippy --locked --workspace --exclude html5ever --all-targets -- -D warnings

      # The app has no integration-test target, so nextest builds its test harness but not its
      # normal executable. Retain that cfg(not(test))/link coverage, without building extra targets.
      - name: Build application binaries
        run: bash rust/ci/cargo.sh build --locked --workspace --bins

      # Build with the same workspace/features as clippy and the following nextest run, then run
      # only the blocking database tests. The workspace filter below avoids executing them twice.
      - name: Tests (campfire_db)
        shell: bash
        run: |
          bash rust/ci/cargo.sh nextest run --locked --workspace --exclude html5ever \
            --profile ci --no-fail-fast -E 'package(campfire_db)'
          cp rust/target/nextest/ci/junit.xml "$RUNNER_TEMP/db-junit.xml"
          # nextest does not run doctests; database doctests remain part of the blocking gate.
          bash rust/ci/cargo.sh test --locked -p campfire_db --doc --no-fail-fast 2>&1 |
            tee "$RUNNER_TEMP/db-doc.log"

      # Capture all failures and keep running the rest of the suite; the explicit gate
      # below then makes missing seeds and failed app tests fail the job.
      - name: Tests (seed-dependent campfire)
        id: app-tests
        continue-on-error: true
        shell: bash
        run: |
          status=0
          bash rust/ci/cargo.sh nextest run --locked --workspace --exclude html5ever \
            --profile ci --no-fail-fast -E 'package(campfire)' 2>&1 |
            tee "$RUNNER_TEMP/campfire-nextest.log" || status=$?
          cp rust/target/nextest/ci/junit.xml "$RUNNER_TEMP/campfire-junit.xml"
          exit "$status"

      # NON-BLOCKING until the rest of the port catches up with our Rails app. Database tests are
      # gated above; reference failures still fail this step and are counted in the summary.
      - name: Tests (non-blocking)
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          bash rust/ci/cargo.sh nextest run --locked --workspace --exclude html5ever \
            --profile ci --no-fail-fast -E 'not package(campfire_db) and not package(campfire)' 2>&1 |
            tee "$RUNNER_TEMP/nextest.log"

      - name: Doctests (non-blocking)
        id: doctests
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        continue-on-error: true
        shell: bash
        run: |
          bash rust/ci/cargo.sh test --locked --workspace --exclude html5ever --exclude campfire_db \
            --doc --no-fail-fast 2>&1 | tee "$RUNNER_TEMP/workspace-doc.log"

      - name: Summarize tests
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        env:
          TMPDIR: ${{ runner.temp }}
          TEST_OUTCOME: ${{ steps.tests.outcome == 'success' && steps.app-tests.outcome == 'success' && 'success' || 'failure' }}
          DOC_OUTCOME: ${{ steps.doctests.outcome }}
        run: |
          python3 -m unittest discover -s rust/ci -p 'test_*.py'
          python3 rust/ci/summarize-tests.py \
            --junit "$RUNNER_TEMP/db-junit.xml" --junit "$RUNNER_TEMP/campfire-junit.xml" --junit rust/target/nextest/ci/junit.xml \
            --doc-log "$RUNNER_TEMP/db-doc.log" --doc-log "$RUNNER_TEMP/workspace-doc.log"

      - name: Gate seed-dependent tests
        if: ${{ !cancelled() && steps.app-tests.outcome != 'success' }}
        run: |
          echo '::error::Seed-dependent campfire tests failed; see the campfire nextest log.'
          exit 1

      - name: Save cargo registry and target
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            rust/.cargo-home/registry
            rust/target
          key: rust-cargo-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/Dockerfile', 'rust/Cargo.toml', 'rust/ci/cargo.sh') }}-${{ hashFiles('rust/Cargo.lock') }}-${{ github.sha }}
