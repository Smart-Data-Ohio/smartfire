name: Rust

# The Rust workspace at the repository root: clippy, binary build and tests, in the toolchain stage
# of the Dockerfile (the same libvips and ffmpeg builds as its image, so the storage vectors' byte
# checks run rather than skip). The app reads only its own inputs: web/ and fixtures/, and the seeds
# and recordings the original Rails app built once, which are committed and frozen.
#
# This workflow only checks: it has read-only contents permission, no secrets and no id-token, and
# nothing is pushed or published. Deploys stay behind the manual Deploy to GCP workflow, which
# requires a full main/nightly run for Rust candidates.
#
# Long suites run as parallel shards; a final job per gate ("Rust port", "Rust correctness")
# fails unless every shard succeeded and their receipts add up to the whole suite.

on:
  push:
    branches: [ main ]
  # Every pull request gets a "Rust port" result, so it can be a required check; the
  # changes job decides whether the PR touched anything the Rust gates read.
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "37 5 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to test (defaults to the workflow ref)
        type: string
        required: false
        default: ''
      scope:
        description: Jobs to run for this manual check
        type: choice
        required: false
        default: full
        options:
          - full
          - messaging-and-browsers

permissions: {}

# A new push to a pull request supersedes the run for its previous commit.
# Pushes to main share one group and are never cancelled once running, but a newer push
# replaces one still waiting: when merges land close together only the newest main commit
# gets its full run (releases go from that commit), which keeps runner demand down.
concurrency:
  group: rust-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || inputs.ref || (github.event_name == 'push' && 'main-push') || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: "true"
  RUST_CI_IMAGE: campfire-toolchain
  RUST_CI_CONTAINER_PREFIX: campfire-ci
  # Dev/test builds compile the campfire crates with Cranelift (.cargo/config.toml), which can't
  # unwind, so these panic-recovery tests run in their own job with those crates on LLVM, as
  # production builds them (ci/llvm.toml; the ci-llvm nextest profile selects the app's crates).
  # The scheduled run tests the whole suite on LLVM.
  CAMPFIRE_LLVM: --config=ci/llvm.toml
  CAMPFIRE_LLVM_ONLY_TESTS: >-
    test(=channels::message_features::tests::origin_is_present_for_commit_callbacks_and_restored_after_errors_and_panics) |
    test(=controllers::agent_review_r5_tests::ws11_proxy_header_oracle_rejects_unapproved_changes) |
    test(=jobs::tests::a_panicking_ad_hoc_job_is_logged_and_its_worker_carries_on) |
    test(=test_support::server_startup_panics_reach_the_reporter_and_join_handle)

jobs:
  # Resolve a requested ref once. Re-runs reuse this run's first-attempt artifact,
  # so even a full re-run cannot follow a branch or tag that has moved meanwhile.
  source:
    name: Rust source
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.pin.outputs.sha }}
    steps:
      - name: Restore the first attempt's commit pin
        if: github.run_attempt > 1
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: rust-source-${{ github.run_id }}
          path: ${{ runner.temp }}/source
          # Use the run-wide API rather than the current attempt's runtime token.
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
      - name: Resolve the requested ref on the first attempt
        if: github.run_attempt == 1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Pin the tested commit
        id: pin
        env:
          REQUESTED_REF: ${{ inputs.ref || github.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import subprocess

          path = Path(os.environ["RUNNER_TEMP"]) / "source/source.json"
          context = {key: os.environ[value] for key, value in (
              ("run_id", "GITHUB_RUN_ID"), ("event_sha", "GITHUB_SHA"),
              ("workflow_sha", "GITHUB_WORKFLOW_SHA"), ("ref", "REQUESTED_REF"),
          )}
          first = os.environ["GITHUB_RUN_ATTEMPT"] == "1"
          if first:
              head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
              pin = dict(context, version=1, head=head)
          else:
              if not path.is_file():
                  raise SystemExit("The first attempt's source pin is missing; start a new workflow run.")
              pin = json.loads(path.read_text())
          if not isinstance(pin, dict) or pin.get("version") != 1 or any(pin.get(k) != v for k, v in context.items()):
              raise SystemExit("Source pin does not belong to this workflow run.")
          head = pin.get("head", "")
          if not isinstance(head, str) or not re.fullmatch(r"[0-9a-f]{40}", head):
              raise SystemExit("Source pin must contain a full commit SHA.")
          if first:
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(json.dumps(pin, indent=2) + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"sha={head}\n")
          print(f"{'Pinned' if first else 'Reusing pinned'} commit {head}")
          PY
      - name: Retain the first attempt's commit pin
        if: github.run_attempt == 1
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rust-source-${{ github.run_id }}
          path: ${{ runner.temp }}/source/source.json
          if-no-files-found: error
          retention-days: 90

  # Skip ordinary Rust checks for docs, deploy scripts and SPA-only sources; frontend auth
  # assets and generated types are Rust inputs. Page suites additionally cover changes to the
  # classic app, its build inputs and browser harness. Both required gates report intentional
  # skips. Pushes, nightly/manual runs, empty diffs and unavailable history keep full coverage.
  changes:
    name: Rust changes
    needs: source
    runs-on: ubuntu-latest
    env:
      CI_SOURCE_SHA: ${{ needs.source.outputs.sha }}
    permissions:
      contents: read
    outputs:
      rust: ${{ steps.scope.outputs.rust }}
      pages: ${{ steps.scope.outputs.pages }}
    steps:
      - name: Checkout PR history
        id: history
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Decide whether Rust and page gates are needed
        id: scope
        env:
          HISTORY_OUTCOME: ${{ steps.history.outcome }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess

          # Any path outside the exclusions, including a new top-level one, runs ordinary Rust
          # checks. frontend/src/gen is exported by crates/api_types and checked by clippy.
          OUTSIDE = (b"docs/", b"deploy/", b"frontend/", b".github/")
          PROSE = (b"README.md", b"ROADMAP.md", b"CONTRIBUTING.md", b"SECURITY.md",
                   b"THIRD_PARTY_NOTICES.md", b"MIT-LICENSE")
          SETUP = (b".github/actions/rust-setup/",)
          GENERATED = (b"frontend/src/gen/",)
          FILES = (b".github/workflows/rust.yml",)
          # Keep the auth inputs in sync with crates/assets/build/auth.rs and the copy list in
          # ci/with-release-inputs.sh (also Dockerfile). styles/ includes the bundled fonts.
          AUTH_DIRS = (b"frontend/src/auth/", b"frontend/src/styles/", b"frontend/src/motion/")
          AUTH_FILES = (b"frontend/src/ui/button.css", b"frontend/src/ui/text-field.css",
                        b"frontend/src/ui/checkbox.css")
          # crates/spa/build.rs also reads frontend/dist when present (normally a stub in CI).
          DIST = (b"frontend/dist/",)
          # The correctness suites boot the classic app: views/assets, web/controllers, shared
          # auth/session/data/jobs and server wiring all affect it. Include whole crates and
          # harness trees rather than guessing which helper, fixture or seed a browser reads.
          PAGE_DIRS = (b"crates/", b"web/", b"reference-tools/", b"parity/", b"fixtures/",
                       b"test-support/", b"vectors/", b"ci/", b".cargo/", b".config/")
          PAGE_FILES = FILES + (b"Cargo.toml", b"Cargo.lock", b"rust-toolchain.toml",
                                b"Dockerfile", b".dockerignore")

          def rust_input(path):
              if path.startswith(SETUP + GENERATED + AUTH_DIRS + DIST) or path in FILES + AUTH_FILES:
                  return True
              return not (path.startswith(OUTSIDE) or path in PROSE)

          def page_input(path):
              # /api/v1 and its sync renderer are mounted only with SPA_ENABLED; these suites
              # exercise classic pages. API-only changes still run ordinary Rust/Frontend checks.
              if path.startswith(b"crates/api/"):
                  return False
              return path.startswith(PAGE_DIRS + SETUP + AUTH_DIRS + DIST) or path in PAGE_FILES + AUTH_FILES

          rust = True
          pages = True
          try:
              if os.environ["GITHUB_EVENT_NAME"] == "pull_request":
                  if os.environ["HISTORY_OUTCOME"] != "success":
                      print("::warning::PR history checkout unavailable; running the full Rust gates.")
                  else:
                      with open(os.environ["GITHUB_EVENT_PATH"]) as event_file:
                          pr = json.load(event_file)["pull_request"]
                      # Include both sides of renames. An empty diff keeps full coverage.
                      diff = subprocess.check_output([
                          "git", "diff", "--no-renames", "--name-only", "-z",
                          f'{pr["base"]["sha"]}...{pr["head"]["sha"]}', "--",
                      ])
                      paths = [path for path in diff.split(b"\0") if path]
                      rust = not paths or any(rust_input(path) for path in paths)
                      pages = not paths or any(page_input(path) for path in paths)
          except (OSError, KeyError, ValueError, TypeError, subprocess.CalledProcessError) as error:
              rust = True
              pages = True
              print(f"::warning::PR diff unavailable ({type(error).__name__}); running the full Rust gates.")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"rust={str(rust).lower()}\n")
              output.write(f"pages={str(pages).lower()}\n")
          print("Run the Rust gates" if rust else "No Rust inputs changed: skip the Rust gates")
          print("Run the page suites" if pages else "No page inputs changed: skip the page suites")
          PY

  # The committed default/first_run/agents_ui/ledger_originals seeds (parity/seeds/frozen), built
  # once by the Rails app: their manifest, keys and schema version match this checkout, and the
  # checker rejects changed, missing or out-of-date seeds. Every job restores them the same way.
  seeds:
    name: Rust seeds
    needs: [source, changes]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    env:
      CI_SOURCE_SHA: ${{ needs.source.outputs.sha }}
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false

      - name: Prove the seed check rejects changed or missing seeds
        run: python3 -m unittest discover -s parity -p test_frozen_seeds.py

      - name: Check the committed seeds
        run: python3 parity/bin/frozen-seeds check

  # Every ordinary nextest test but the four LLVM-only ones (the llvm job), split round-robin
  # by nextest into twelve slices.
  test:
    name: Rust tests (${{ matrix.shard }})
    needs: [source, changes]
    if: needs.changes.outputs.rust == 'true' && inputs.scope != 'messaging-and-browsers'
    runs-on: ubuntu-latest
    env:
      CI_SOURCE_SHA: ${{ needs.source.outputs.sha }}
    permissions:
      contents: read
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/12", "2/12", "3/12", "4/12", "5/12", "6/12", "7/12", "8/12", "9/12", "10/12", "11/12", "12/12"]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false

      - name: Prepare shared Rust CI inputs
        id: setup
        uses: ./.github/actions/rust-setup # zizmor: ignore[self-repository] -- setup must follow the selected checkout, including a manual PR ref
        with:
          parity: seeds
          cargo-cache: tests

      # Capture all failures and keep running; the explicit gate below then makes missing
      # seeds and failed tests fail the job.
      - name: Tests
        id: tests
        continue-on-error: true
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          status=0
          selection=(-E "not (rdeps(campfire_app) and ($CAMPFIRE_LLVM_ONLY_TESTS))")
          if [[ "$GITHUB_EVENT_NAME" == schedule ]]; then selection+=("$CAMPFIRE_LLVM"); fi
          bash ci/cargo.sh nextest run --locked --workspace --exclude html5ever \
            --profile ci -j 4 --no-fail-fast --no-tests fail --partition "slice:$SHARD" "${selection[@]}" 2>&1 |
            tee "$RUNNER_TEMP/nextest.log" || status=$?
          mkdir -p "$RUNNER_TEMP/results"
          cp target/nextest/ci/junit.xml "$RUNNER_TEMP/results/junit-${SHARD/\//of}.xml"
          exit "$status"

      # What the shards together must run, listed from the workspace harnesses compiled above.
      # `Rust port` checks their receipts against this unpartitioned list.
      - name: List the tests the shards must run
        if: ${{ !cancelled() && matrix.shard == '1/12' }}
        shell: bash
        run: |
          llvm=()
          if [[ "$GITHUB_EVENT_NAME" == schedule ]]; then llvm=("$CAMPFIRE_LLVM"); fi
          mkdir -p "$RUNNER_TEMP/results"
          bash ci/cargo.sh nextest list --locked --message-format json "${llvm[@]}" \
            --workspace --exclude html5ever --profile ci -E "not (rdeps(campfire_app) and ($CAMPFIRE_LLVM_ONLY_TESTS))" \
            > "$RUNNER_TEMP/results/list-shards.json"

      # Lists ignored tests from the harnesses compiled above, with no partition or filter.
      - name: Enumerate compiled ignored tests
        if: ${{ !cancelled() && matrix.shard == '1/12' }}
        run: bash ci/verify-ignored.sh

      - name: Retain test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          overwrite: true
          name: rust-tests-${{ strategy.job-index }}-${{ needs.source.outputs.sha }}
          path: ${{ runner.temp }}/results/
          if-no-files-found: error

      - name: Gate tests
        if: ${{ !cancelled() && steps.tests.outcome != 'success' }}
        run: |
          echo '::error::Rust tests failed; see the Tests step log.'
          exit 1

      - name: Keep only dependency artifacts for the cache
        if: ${{ matrix.shard == '1/12' && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.setup.outputs.cargo-cache-hit != 'true' }}
        run: python3 ci/prune-target.py target

      - name: Save cargo registry and target
        if: ${{ matrix.shard == '1/12' && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.setup.outputs.cargo-cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cargo-home/registry
            target
          key: ${{ steps.setup.outputs.cargo-cache-key }}

  clippy:
    name: Rust clippy, binaries and doctests
    needs: [source, changes]
    if: needs.changes.outputs.rust == 'true' && inputs.scope != 'messaging-and-browsers'
    runs-on: ubuntu-latest
    env:
      CI_SOURCE_SHA: ${{ needs.source.outputs.sha }}
    permissions:
      contents: read
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false

      - name: Check ignored-test coverage
        run: python3 -m unittest discover -s ci -p 'test_*.py'

      - name: Prepare shared Rust CI inputs
        id: setup
        uses: ./.github/actions/rust-setup # zizmor: ignore[self-repository] -- setup must follow the selected checkout, including a manual PR ref
        with:
          parity: seeds
          cargo-cache: build

      - name: Clippy
        run: bash ci/cargo.sh clippy --locked --workspace --exclude html5ever --all-targets -- -D warnings

      # The front end's types are generated from crates/api_types and committed. Regenerate them
      # from scratch (so a removed type's file shows up too) and fail on any difference.
      - name: Check the generated TypeScript types (frontend/src/gen)
        shell: bash
        run: |
          rm -f frontend/src/gen/*.ts
          bash ci/cargo.sh test --locked -p campfire_api_types export_bindings
          if [[ -n "$(git status --porcelain -- frontend/src/gen)" ]]; then
            git status --short -- frontend/src/gen
            git --no-pager diff -- frontend/src/gen
            echo '::error::frontend/src/gen is out of date with crates/api_types. Run pnpm gen in frontend/ and commit the result.'
            exit 1
          fi

      # The app has no integration-test target, so nextest builds its test harness but not its
      # normal executable. Retain that cfg(not(test))/link coverage, without building extra targets.
      - name: Build application binaries with production inputs
        run: bash ci/with-release-inputs.sh bash ./ci/cargo.sh build --locked --workspace --bins

      # nextest does not run doctests; database doctests remain part of the blocking gate.
      - name: Doctests (campfire_db)
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/results"
          bash ci/cargo.sh test --locked -p campfire_db --doc --no-fail-fast 2>&1 |
            tee "$RUNNER_TEMP/results/db-doc.log"

      - name: Doctests (other workspace)
        id: doctests
        continue-on-error: true
        shell: bash
        run: |
          bash ci/cargo.sh test --locked --workspace --exclude html5ever --exclude campfire_db \
            --doc --no-fail-fast 2>&1 | tee "$RUNNER_TEMP/results/workspace-doc.log"

      - name: Retain doctest logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          overwrite: true
          name: rust-doctests-${{ needs.source.outputs.sha }}
          path: ${{ runner.temp }}/results/
          if-no-files-found: error

      - name: Gate workspace doctests
        if: ${{ !cancelled() && steps.doctests.outcome != 'success' }}
        run: |
          echo '::error::Workspace doctests failed; see the Doctests step log.'
          exit 1

      - name: Keep only dependency artifacts for the cache
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.setup.outputs.cargo-cache-hit != 'true' }}
        run: python3 ci/prune-target.py target

      - name: Save cargo registry and target
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.setup.outputs.cargo-cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cargo-home/registry
            target
          key: ${{ steps.setup.outputs.cargo-cache-key }}

  # The panic-recovery tests the shards leave out, with campfire built by LLVM.
  llvm:
    name: Rust tests (campfire panic recovery, LLVM)
    needs: [source, changes]
    if: needs.changes.outputs.rust == 'true' && inputs.scope != 'messaging-and-browsers'
    runs-on: ubuntu-latest
    env:
      CI_SOURCE_SHA: ${{ needs.source.outputs.sha }}
    permissions:
      contents: read
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false

      - name: Prepare shared Rust CI inputs
        uses: ./.github/actions/rust-setup # zizmor: ignore[self-repository] -- setup must follow the selected checkout, including a manual PR ref
        with:
          parity: seeds
          cargo-cache: tests

      - name: Tests (campfire panic recovery, LLVM)
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          status=0
          bash ci/cargo.sh nextest run --locked -p campfire -p campfire_app --profile ci-llvm -j 4 --no-fail-fast --no-tests fail \
            "$CAMPFIRE_LLVM" -E "$CAMPFIRE_LLVM_ONLY_TESTS" || status=$?
          mkdir -p "$RUNNER_TEMP/results"
          cp target/nextest/ci-llvm/junit.xml "$RUNNER_TEMP/results/junit-llvm.xml"
          exit "$status"

      # List from this job's LLVM harnesses, with the same packages and profile as its run.
      # Listing these in a workspace shard triggers another build.
      - name: List the tests the LLVM job must run
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/results"
          bash ci/cargo.sh nextest list --locked -p campfire -p campfire_app --profile ci-llvm \
            --message-format json "$CAMPFIRE_LLVM" -E "$CAMPFIRE_LLVM_ONLY_TESTS" \
            > "$RUNNER_TEMP/results/list-llvm.json"

      - name: Retain test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          overwrite: true
          name: rust-tests-llvm-${{ needs.source.outputs.sha }}
          path: ${{ runner.temp }}/results/
          if-no-files-found: error

      - name: Gate tests
        if: ${{ !cancelled() }}
        env:
          OUTCOME: ${{ steps.tests.outcome }}
        run: |
          python3 - "$RUNNER_TEMP/results/junit-llvm.xml" <<'PY'
          import os, sys, xml.etree.ElementTree as ET
          # The ci profile also reports the crate's #[ignore] tests, as skipped.
          ran = [c for c in ET.parse(sys.argv[1]).getroot().iter('testcase') if c.find('skipped') is None]
          passed = [c for c in ran if c.find('failure') is None and c.find('error') is None]
          print(f'{len(passed)} of {len(ran)} panic-recovery tests passed on LLVM')
          sys.exit(0 if os.environ['OUTCOME'] == 'success' and len(ran) == len(passed) == 4 else 1)
          PY

  # Production builds on the image's stable toolchain, not the nightly the tests use.
  # RUSTUP_TOOLCHAIN overrides rust-toolchain.toml, and Cargo runs from its scratch directory,
  # outside the workspace, so .cargo/config.toml's Cranelift settings don't apply; its check-mode
  # dependencies have their own `stable` Cargo cache.
  stable:
    name: Rust production toolchain check
    needs: [source, changes]
    if: needs.changes.outputs.rust == 'true' && inputs.scope != 'messaging-and-browsers'
    runs-on: ubuntu-latest
    env:
      CI_SOURCE_SHA: ${{ needs.source.outputs.sha }}
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false

      - name: Prepare shared Rust CI inputs
        id: setup
        uses: ./.github/actions/rust-setup # zizmor: ignore[self-repository] -- setup must follow the selected checkout, including a manual PR ref
        with:
          parity: none
          cargo-cache: stable

      # The release the Dockerfile's production stages build with (its RUST_VERSION).
      - name: Check with the production toolchain
        env:
          RUST_CI_WORKDIR: /ci-tmp
        shell: bash
        run: |
          RUSTUP_TOOLCHAIN=$(sed -nE 's/^ARG RUST_VERSION=([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' Dockerfile)
          [[ -n "$RUSTUP_TOOLCHAIN" ]] || { echo "::error::RUST_VERSION not found in Dockerfile"; exit 1; }
          echo "Production toolchain: $RUSTUP_TOOLCHAIN"
          export RUSTUP_TOOLCHAIN
          bash ci/cargo.sh check --locked --manifest-path /src/Cargo.toml --workspace --exclude html5ever

      - name: Keep only dependency artifacts for the cache
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.setup.outputs.cargo-cache-hit != 'true' }}
        run: python3 ci/prune-target.py target

      - name: Save cargo registry and target
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.setup.outputs.cargo-cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cargo-home/registry
            target
          key: ${{ steps.setup.outputs.cargo-cache-key }}

  rust:
    # Required by name in the branch ruleset, and deploy-gcp.yml looks this job up by name too.
    name: Rust port
    needs: [source, changes, seeds, test, clippy, llvm, stable]
    if: ${{ always() && inputs.scope != 'messaging-and-browsers' }}
    runs-on: ubuntu-latest
    env:
      CI_SOURCE_SHA: ${{ needs.source.outputs.sha }}
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Require successful source resolution
        env:
          SOURCE_RESULT: ${{ needs.source.result }}
        run: test "$SOURCE_RESULT" = success

      - name: Require successful change detection
        env:
          CHANGE_RESULT: ${{ needs.changes.result }}
        run: test "$CHANGE_RESULT" = success

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
          sparse-checkout: |
            ci
            .github/workflows

      - name: Require every job to be gated
        run: python3 ci/check_gate_needs.py .github/workflows/rust.yml

      - name: Collect test results
        if: ${{ needs.changes.outputs.rust == 'true' && (needs.test.result != 'skipped' || needs.clippy.result != 'skipped' || needs.llvm.result != 'skipped') }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: rust-{tests-*,doctests}-${{ needs.source.outputs.sha }}
          path: ${{ runner.temp }}/results
          merge-multiple: true

      - name: Summarize tests
        if: needs.changes.outputs.rust == 'true'
        env:
          TEST_OUTCOME: ${{ needs.test.result }}
          DOC_OUTCOME: ${{ needs.clippy.result }}
        shell: bash
        run: |
          shopt -s nullglob
          args=()
          results="$RUNNER_TEMP/results"
          shards=("$results"/junit-*of12.xml)
          for path in "${shards[@]}" "$results/junit-llvm.xml"; do args+=(--junit "$path"); done
          args+=(--doc-log "$results/db-doc.log" --doc-log "$results/workspace-doc.log")
          # Each listed test passed exactly once, each #[ignore] test was reported, and libtest
          # accounted for every doctest; any difference fails this job.
          args+=(--expect "$results/list-shards.json" "${shards[@]}")
          args+=(--expect "$results/list-llvm.json" "$results/junit-llvm.xml")
          python3 ci/summarize-tests.py "${args[@]}"

      # When Rust inputs changed, every shard and prerequisite job must have succeeded:
      # failed, cancelled and skipped all fail this check. When none changed, every one of
      # them must have been skipped by that decision.
      - name: Gate on every Rust port job
        if: ${{ !cancelled() }}
        env:
          NEEDS: ${{ toJSON(needs) }}
          RUST: ${{ needs.changes.outputs.rust }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          results = {job: value["result"] for job, value in json.loads(os.environ["NEEDS"]).items()}
          print("\n".join(f"{job}: {result}" for job, result in results.items()))
          expected = "success" if os.environ["RUST"] == "true" else "skipped"
          if os.environ["RUST"] != "true":
              print("No Rust inputs changed: the Rust gates were intentionally skipped.")
          sys.exit(results.pop("source") != "success" or results.pop("changes") != "success"
                   or any(result != expected for result in results.values()))
          PY

  # Compile campfire's stable/LLVM test harness once for browsers, Drive and LiveKit.
  # nextest archives preserve test metadata and executables without carrying Cargo fingerprints.
  correctness-tests:
    name: Rust correctness test build
    needs: [source, changes]
    if: needs.changes.outputs.pages == 'true'
    runs-on: ubuntu-latest
    env:
      CI_SOURCE_SHA: ${{ needs.source.outputs.sha }}
    permissions:
      contents: read
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - name: Prepare shared Rust CI inputs
        uses: ./.github/actions/rust-setup # zizmor: ignore[self-repository] -- setup must follow the selected checkout, including a manual PR ref
        with:
          parity: none
          cargo-cache: correctness
      - name: Prove the nextest archive round-trip
        env:
          RUST_CORRECTNESS_IMAGE: campfire-toolchain
        run: bash ci/exec.sh env CI_REQUIRE_NEXTEST_ARCHIVE_TEST=1 python3 -m unittest discover -s ci -p test_correctness_archive.py -v
      - name: Archive the stable correctness test harness
        env:
          RUST_CORRECTNESS_IMAGE: campfire-toolchain
        run: |
          bash ci/exec.sh cargo nextest archive --locked -p campfire --profile ci \
            --archive-file target/correctness-tests.tar.zst
          python3 ci/artifact_provenance.py record target/correctness-tests.tar.zst --head "$CI_SOURCE_SHA"
      - name: Retain the test harness
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          overwrite: true
          name: rust-browser-test-build-${{ needs.source.outputs.sha }}
          path: |
            target/correctness-tests.tar.zst
            target/correctness-tests.tar.zst.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  correctness:
    name: Rust correctness (${{ matrix.suite }})
    needs: [source, changes]
    if: needs.changes.outputs.pages == 'true' && inputs.scope != 'messaging-and-browsers'
    runs-on: ubuntu-latest
    env:
      CI_SOURCE_SHA: ${{ needs.source.outputs.sha }}
    permissions:
      contents: read
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        suite: [acme, agents-ui]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false

      - name: Prepare shared Rust CI inputs
        id: setup
        uses: ./.github/actions/rust-setup # zizmor: ignore[self-repository] -- setup must follow the selected checkout, including a manual PR ref
        with:
          parity: seeds
          cargo-cache: correctness

      - name: Build pinned correctness prerequisites
        run: docker build --build-arg BASE_IMAGE=campfire-toolchain -f ci/Dockerfile -t campfire-correctness .

      - name: Run prerequisite-backed correctness suite
        env:
          SUITE: ${{ matrix.suite }}
        run: bash ci/exec.sh bash ci/correctness.sh "$SUITE"

      - name: Retain correctness receipts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          overwrite: true
          name: rust-correctness-${{ matrix.suite }}-${{ needs.source.outputs.sha }}
          path: target/ci-receipts/
          if-no-files-found: error
      - name: Warm the full correctness harness dependencies
        if: ${{ matrix.suite == 'agents-ui' && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.setup.outputs.cargo-cache-hit != 'true' }}
        env:
          RUST_CORRECTNESS_IMAGE: campfire-toolchain
        run: bash ci/exec.sh cargo nextest list --locked -p campfire --profile ci --build-jobs 4 --message-format json > /dev/null
      - name: Keep only dependency artifacts for the cache
        if: ${{ matrix.suite == 'agents-ui' && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.setup.outputs.cargo-cache-hit != 'true' }}
        run: python3 ci/prune-target.py target
      - name: Save cargo registry and target
        if: ${{ matrix.suite == 'agents-ui' && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.setup.outputs.cargo-cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cargo-home/registry
            target
          key: ${{ steps.setup.outputs.cargo-cache-key }}

  correctness-browsers:
    name: Rust correctness (browsers ${{ matrix.shard }})
    needs: [source, changes, correctness-app, correctness-image, correctness-tests]
    if: needs.changes.outputs.pages == 'true'
    runs-on: ubuntu-latest
    env:
      CI_SOURCE_SHA: ${{ needs.source.outputs.sha }}
    permissions:
      contents: read
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        suite: [browsers]
        shard: ["1/5", "2/5", "3/5", "4/5", "5/5"]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - name: Prepare shared Rust CI inputs
        uses: ./.github/actions/rust-setup # zizmor: ignore[self-repository] -- setup must follow the selected checkout, including a manual PR ref
        with:
          parity: seeds
          toolchain: 'false'
      - name: Collect the correctness test harness
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: rust-browser-test-build-${{ needs.source.outputs.sha }}
          path: target
      - name: Verify the correctness test harness
        run: python3 ci/artifact_provenance.py verify target/correctness-tests.tar.zst --head "$CI_SOURCE_SHA"
      - name: Collect the application server
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: rust-messaging-host-app-${{ needs.source.outputs.sha }}
          path: ${{ runner.temp }}/server
      - name: Install the application server
        run: |
          python3 ci/artifact_provenance.py verify "$RUNNER_TEMP/server/messaging-host.tar" --head "$CI_SOURCE_SHA"
          tar -C target -xf "$RUNNER_TEMP/server/messaging-host.tar"
      - name: Collect pinned correctness prerequisites
