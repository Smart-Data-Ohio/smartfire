name: OAuth browser

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions: {}

concurrency:
  group: oauth-browser-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  acceptance:
    name: OAuth browser
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 35
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: Decide whether OAuth acceptance is needed
        id: scope
        env:
          PATTERN: '^(crates/|frontend/|fixtures/|test-support/|parity/|\.cargo/|Cargo\.(toml|lock)$|rust-toolchain\.toml$|ops/scripts/mcp-oauth-smoke\.sh$|\.github/workflows/oauth-browser\.yml$|\.github/scripts/)'
        run: python3 .github/scripts/check-paths.py
      - name: Set up Node
        if: steps.scope.outputs.run == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Set up pnpm
        if: steps.scope.outputs.run == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
          cache: true
          cache_dependency_path: frontend/pnpm-lock.yaml
      - name: Install browser and build the SPA
        if: steps.scope.outputs.run == 'true'
        run: |
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend exec playwright install --with-deps chromium
          pnpm --dir frontend build
      # This test exercises auth and JSON, so the distro media libraries suffice.
      # Byte-for-byte media tests remain in the Rust toolchain image jobs.
      - name: Prepare Rust and frozen seeds
        if: steps.scope.outputs.run == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y libvips-dev libexpat1-dev
          rustup show
          python3 parity/bin/frozen-seeds restore
      - name: Run Playwright through the seeded Rust binary
        if: steps.scope.outputs.run == 'true'
        env:
          SPA_DIST: frontend/dist
          SMARTFIRE_E2E_PORT: '4398'
          TMPDIR: ${{ runner.temp }}
          CI: 'true'
          CARGO_BUILD_JOBS: '1'
        run: cargo test --locked -j 1 -p campfire --bin campfire controllers::oauth_browser_tests::oauth_browser_acceptance -- --ignored --exact --nocapture
      - name: Keep failed browser traces
        if: failure() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: oauth-browser-traces
          path: frontend/test-results/
          if-no-files-found: ignore
