name: Publish image

# Build only the amd64 image deployed from Artifact Registry. Deploy calls this for its
# resolved revision when the immutable rust-git-<sha> tag is absent. Existing tags keep
# their digest. Manual runs default to a build without publishing.

on:
  workflow_call:
    inputs:
      git_sha:
        description: Full source SHA to build
        type: string
        required: true
      environment:
        description: GitHub environment holding the publisher configuration
        type: string
        required: true
      dry_run:
        type: boolean
        default: false
    outputs:
      digest:
        description: Published immutable image digest
        value: ${{ jobs.amd64.outputs.digest }}
      reference:
        description: Published image repository and digest
        value: ${{ jobs.amd64.outputs.reference }}
  workflow_dispatch:
    inputs:
      git_sha:
        description: Full source SHA (defaults to the dispatched revision)
        type: string
        default: ''
      environment:
        description: GitHub environment holding the publisher configuration
        type: environment
        default: production
      dry_run:
        description: Build amd64 without publishing
        type: boolean
        default: true

# Serialize writes of one immutable tag. Dry runs never share a publishing group.
concurrency:
  group: publish-image-${{ !inputs.dry_run && (inputs.git_sha || github.sha) || format('dry-run-{0}', github.run_id) }}
  cancel-in-progress: false

permissions: {}

env:
  IMAGE_DESCRIPTION: "Smartfire is a free, open source workspace where people and AI agents work together: rooms, threads, huddles with voice, video and screen sharing, work tracking, agent API, and rich GitHub and X cards. Single-tenant; production-ready image with web app, background jobs, caching, file serving, and SSL."
  SOURCE_URL: https://github.com/${{ github.repository }}
  AR_REGISTRY: us-central1-docker.pkg.dev
  # The workflow definition must be reviewed on main before it can publish.
  PUBLISH: ${{ !inputs.dry_run && github.ref == 'refs/heads/main' }}

jobs:
  amd64:
    name: Build linux/amd64 and publish to Artifact Registry
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    timeout-minutes: 90
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
      reference: ${{ steps.digest.outputs.reference }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.git_sha || github.sha }}
          persist-credentials: false

      - name: Plan tag and version
        id: plan
        shell: bash
        env:
          IMAGE: ${{ vars.GCP_IMAGE }}
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::source must resolve to a full SHA"; exit 1; }
          if [ "$PUBLISH" = true ]; then
            test -n "$IMAGE" || { echo "::error::repository variable GCP_IMAGE is not set"; exit 1; }
          else
            IMAGE="${IMAGE:-campfire-dry-run}"
          fi
          version="${SHA::7}"
          {
            echo "image=${IMAGE}"
            echo "tag=rust-git-${SHA}"
            echo "version=${version}"
            echo "sha=${SHA}"
          } >> "$GITHUB_OUTPUT"
          echo "Source revision ${SHA} -> ${IMAGE}:rust-git-${SHA} (publish=${PUBLISH})"

      # This writes gha-creds-*.json into the workspace, the build context: setup-gcloud signs
      # gcloud in with it for the tag checks. The root .dockerignore keeps it, and err.log,
      # out of the context (ops/tests/test_image_context.py).
      - name: Authenticate to Google Cloud
        id: auth
        if: env.PUBLISH == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_IMAGE_PUBLISHER_SA }}
          token_format: access_token

      - name: Set up Cloud SDK
        if: env.PUBLISH == 'true'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Check whether the immutable tag already exists
        id: existing
        if: env.PUBLISH == 'true'
        shell: bash
        env:
          IMAGE: ${{ steps.plan.outputs.image }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          set -euo pipefail
          status=0
          digest="$(gcloud artifacts docker images describe "${IMAGE}:${TAG}" \
                     --format='value(image_summary.digest)' 2>err.log)" || status=$?
          if [ "$status" -eq 0 ] && printf '%s' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag ${TAG} already published as ${digest}; the build will be skipped."
            rm -f err.log
            exit 0
          fi
          # Only a genuine "not found" means we should build. An auth, network or
          # permission error must fail loudly rather than collide with the immutable tag.
          if grep -Eqi 'not found|does not exist|NOT_FOUND' err.log; then
            rm -f err.log
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Tag ${TAG} is not published yet."
            exit 0
          fi
          echo "::error::could not determine whether ${IMAGE}:${TAG} exists"
          cat err.log
          rm -f err.log
          exit 1

      - name: Set up Docker Buildx
        if: steps.existing.outputs.exists != 'true'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1

      - name: Log in to Artifact Registry
        if: env.PUBLISH == 'true' && steps.existing.outputs.exists != 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.AR_REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Extract Docker metadata (labels)
        if: steps.existing.outputs.exists != 'true'
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.plan.outputs.image }}
          tags: |
            type=raw,value=${{ steps.plan.outputs.tag }}
          flavor: |
            latest=false
          labels: |
            org.opencontainers.image.source=${{ env.SOURCE_URL }}
            org.opencontainers.image.revision=${{ steps.plan.outputs.sha }}

      # provenance and sbom stay off so the tag is a single image manifest, the shape Artifact
      # Registry has always held and the release script inspects.
      - name: Build (linux/amd64)
        if: steps.existing.outputs.exists != 'true'
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          build-args: |
            BASE_REGISTRY=${{ env.PUBLISH == 'true' && 'us-central1-docker.pkg.dev/smart-data-campfire/docker-hub' || 'mirror.gcr.io' }}
            CARGO_BUILD_JOBS=4
            OCI_SOURCE=${{ env.SOURCE_URL }}
            OCI_DESCRIPTION=${{ env.IMAGE_DESCRIPTION }}
            APP_VERSION=${{ steps.plan.outputs.version }}
            GIT_REVISION=${{ steps.plan.outputs.sha }}
          platforms: linux/amd64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The scope publish-rust-image.yml used, so the existing cache carries over.
          cache-from: type=gha,scope=rust-image
          cache-to: ${{ env.PUBLISH == 'true' && 'type=gha,scope=rust-image,mode=max' || '' }}
          sbom: false
          provenance: false

      - name: Resolve the published digest
        id: digest
        if: env.PUBLISH == 'true'
        shell: bash
        env:
          IMAGE: ${{ steps.plan.outputs.image }}
          TAG: ${{ steps.plan.outputs.tag }}
          BUILT_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          digest="$(gcloud artifacts docker images describe "${IMAGE}:${TAG}" \
                      --format='value(image_summary.digest)')"
          printf '%s' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$' \
            || { echo "::error::could not resolve a sha256 digest for ${IMAGE}:${TAG}"; exit 1; }
          if [ -n "$BUILT_DIGEST" ] && [ "$digest" != "$BUILT_DIGEST" ]; then
            echo "::error::${IMAGE}:${TAG} is ${digest}, not the built ${BUILT_DIGEST}"
            exit 1
          fi
          {
            echo "digest=${digest}"
            echo "reference=${IMAGE}@${digest}"
          } >> "$GITHUB_OUTPUT"

      - name: Attest image provenance
        if: env.PUBLISH == 'true' && steps.existing.outputs.exists != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.plan.outputs.image }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: false

      - name: Job summary
        if: env.PUBLISH == 'true'
        shell: bash
        env:
          IMAGE: ${{ steps.plan.outputs.image }}
          TAG: ${{ steps.plan.outputs.tag }}
          DIGEST: ${{ steps.digest.outputs.digest }}
          REFERENCE: ${{ steps.digest.outputs.reference }}
          REUSED: ${{ steps.existing.outputs.exists }}
          SHA: ${{ steps.plan.outputs.sha }}
        run: |
          set -euo pipefail
          if [ "$REUSED" = "true" ]; then
            action="reused the existing immutable tag (no rebuild)"
          else
            action="built and pushed a new linux/amd64 image"
          fi
          {
            echo "## Artifact Registry image"
            echo
            echo "This run $action."
            echo
            echo '```text'
            echo "${REFERENCE}"
            echo '```'
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Image | \`${IMAGE}\` |"
            echo "| Tag | \`${TAG}\` |"
            echo "| Digest | \`${DIGEST}\` |"
            echo "| Source sha | \`${SHA}\` |"
            echo "| Platform | \`linux/amd64\` |"
            echo
            echo "Deploy it with the **Deploy to GCP** workflow using \`git_sha=${SHA}\`."
          } >> "$GITHUB_STEP_SUMMARY"
