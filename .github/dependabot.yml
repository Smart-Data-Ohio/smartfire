version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: bundler
    directory: "/"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    schedule:
      interval: weekly
    cooldown:
      semver-major-days: 7
      semver-minor-days: 3
      semver-patch-days: 2
      default-days: 7
      exclude:
        - "brakeman"

  # No npm ecosystem: the app ships no package.json (importmap with
  # vendored pins, no node build), so there is nothing to update.

  # No docker ecosystem. Our base image tag is a build arg
  # (`FROM ruby:$RUBY_VERSION-slim`), which the updater cannot read, so the
  # entry only ever matched nothing — worse than no entry, because it looked
  # like coverage. Ruby base image bumps are a manual, reviewed step here, as
  # they are across the rest of the fleet. Keep Dockerfile, Dockerfile-export
  # and .ruby-version on the same version by hand.
