version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  # The Rust workspace: what the production binary is built from. The "Dependency audit"
  # check (repo.yml) fails on advisories against Cargo.lock; these PRs fix them.
  - package-ecosystem: cargo
    directory: "/"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    schedule:
      interval: weekly
    cooldown:
      semver-major-days: 7
      semver-minor-days: 3
      semver-patch-days: 2
      default-days: 7

  # The production huddle gateway.
  - package-ecosystem: npm
    directories:
      - "/huddle-gateway"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    schedule:
      interval: weekly
    cooldown:
      semver-major-days: 7
      semver-minor-days: 3
      semver-patch-days: 2
      default-days: 7

  # The React SPA in frontend/ (pnpm), whose build will ship to browsers inside the Rust binary.
  # The Frontend check (frontend.yml) runs on these PRs.
  - package-ecosystem: npm
    directory: "/frontend"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    schedule:
      interval: weekly
    cooldown:
      semver-major-days: 7
      semver-minor-days: 3
      semver-patch-days: 2
      default-days: 7

  # The production image. Dependabot updates the FROM lines it can parse; the rust and debian
  # bases take their tags from build args (RUST_VERSION, DEBIAN_RELEASE), which it can't read,
  # so those stay a manual, reviewed bump.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
