version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  # The Rust workspace: what the production binary is built from. The "Dependency audit"
  # check (repo.yml) fails on advisories against rust/Cargo.lock; these PRs fix them.
  - package-ecosystem: cargo
    directory: "/rust"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    schedule:
      interval: weekly
    cooldown:
      semver-major-days: 7
      semver-minor-days: 3
      semver-patch-days: 2
      default-days: 7

  # Every live Node lockfile: the huddle gateway (runs in production), the builders of the
  # vendored LiveKit client and code highlighter bundles (served to browsers; rebuild the
  # bundle after an update), and the pinned Playwright the browser suites run in.
  - package-ecosystem: npm
    directories:
      - "/rust/web/script/livekit-gateway"
      - "/rust/web/script/livekit-client"
      - "/rust/web/script/code-highlighter"
      - "/rust/parity"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    schedule:
      interval: weekly
    cooldown:
      semver-major-days: 7
      semver-minor-days: 3
      semver-patch-days: 2
      default-days: 7

  # The production image. Dependabot updates the FROM lines it can parse; the rust and debian
  # bases take their tags from build args (RUST_VERSION, DEBIAN_RELEASE), which it can't read,
  # so those stay a manual, reviewed bump.
  - package-ecosystem: docker
    directory: "/rust"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
