[package]
name = "campfire_channels"
version = "0.1.0"
edition.workspace = true

[features]
# Test hooks the crates above drive in their own tests (stopping the workers, the huddle job
# registry). Production builds don't compile them.
test-support = ["campfire_web/test-support", "campfire_app/test-support", "campfire_jobs/test-support", "campfire_cable/test-support", "campfire_kit/test-support", "campfire_db/test-support"]

[dependencies]
httpdate.workspace = true
rails_compat.workspace = true
campfire_kit.workspace = true
campfire_routes.workspace = true
campfire_db.workspace = true
campfire_jobs.workspace = true
campfire_storage.workspace = true
campfire_cable.workspace = true
campfire_views.workspace = true
campfire_app.workspace = true
campfire_web.workspace = true
anyhow.workspace = true
tokio.workspace = true
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
jiff.workspace = true
tracing.workspace = true
async-trait.workspace = true
askama.workspace = true
futures-util.workspace = true
rusqlite.workspace = true
http.workspace = true

[dev-dependencies]
campfire_web = { workspace = true, features = ["test-support"] }
campfire_app = { workspace = true, features = ["test-support"] }
campfire_jobs = { workspace = true, features = ["test-support"] }
campfire_cable = { workspace = true, features = ["test-support"] }
campfire_kit = { workspace = true, features = ["test-support"] }
campfire_db = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["test-util"] }
tempfile.workspace = true
