<div class="room-header__identity room--current min-width" id="{{ nav.room.dom_id("header") }}">
  <span class="room-header__kind">{{ self.kind_label() }}</span>
  <h1 class="room__contents overflow-ellipsis">
    {%- if nav.room.is_direct() %}
      <span class="for-screen-reader">Ping with</span>
    {%- elif nav.icon.is_some() %}
      {{ h::icon_avatar_tag(ctx,nav.icon.as_ref(),32,h::attrs().class("room-header__icon")) }}
    {%- else %}
      <span class="room-header__hash" aria-hidden="true">#</span>
    {%- endif %}

    <span class="room-header__name overflow-ellipsis">{{ nav.room.display_name }}</span>
  </h1>
</div>{{ "\n" }}
