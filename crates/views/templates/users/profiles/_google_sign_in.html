{% if data.configured %}  <section class="margin-block pad-inline pad-block fill-shade border-radius" aria-labelledby="google-sign-in-title">
    <h2 id="google-sign-in-title" class="txt-large">Google sign-in</h2>

{% if let Some(email) = data.email %}      <p>Linked to {{ email }}. You can sign in with Google.</p>
{% else %}      <p>Link your Workspace Google account so you can sign in with Google. You will confirm it with Google.</p>
      {{ self.link() }}
{% endif %}  </section>
{% endif %}
