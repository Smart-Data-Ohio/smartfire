[package]
name = "campfire_controllers"
version = "0.1.0"
edition.workspace = true

[features]
# Test hooks the campfire crate's tests drive (fixed forward IDs, OAuth entropy, the saved and
# scheduled item views). Production builds don't compile them.
test-support = ["campfire_app/test-support"]

[dependencies]
rails_compat.workspace = true
campfire_kit.workspace = true
campfire_routes.workspace = true
campfire_db.workspace = true
campfire_richtext.workspace = true
campfire_storage.workspace = true
campfire_cable.workspace = true
campfire_assets.workspace = true
campfire_views.workspace = true
campfire_retained.workspace = true
campfire_spa.workspace = true
campfire_app.workspace = true
campfire_web.workspace = true
campfire_channels.workspace = true
campfire_messages.workspace = true
campfire_rooms.workspace = true
campfire_people.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
jiff.workspace = true
tracing.workspace = true
askama.workspace = true
rusqlite.workspace = true
tokio.workspace = true
regex.workspace = true
axum.workspace = true
rand.workspace = true
subtle.workspace = true
url.workspace = true
base64.workspace = true

[dev-dependencies]
campfire_app = { workspace = true, features = ["test-support"] }
