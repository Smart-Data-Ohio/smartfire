[package]
name = "campfire_app"
version = "0.1.0"
edition.workspace = true

[features]
# Test helpers the crates above use in their own tests (`test_support`, fixtures, test-only
# accessors). Production builds don't compile them.
test-support = ["dep:rcgen", "tokio/test-util", "campfire_jobs/test-support", "campfire_cable/test-support", "campfire_kit/test-support", "campfire_db/test-support"]

[dependencies]
campfire_presentation.workspace = true
caseless.workspace = true
rails_compat.workspace = true
campfire_kit.workspace = true
campfire_routes.workspace = true
campfire_db.workspace = true
campfire_jobs.workspace = true
campfire_mail.workspace = true
campfire_richtext.workspace = true
campfire_storage.workspace = true
campfire_cable.workspace = true
campfire_api_types.workspace = true
campfire_static_assets.workspace = true
anyhow.workspace = true
libc.workspace = true
tokio.workspace = true
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
jiff.workspace = true
tracing.workspace = true
regex.workspace = true
indexmap = { workspace = true, features = ["serde"] }
futures-util.workspace = true
rusqlite.workspace = true
rand.workspace = true
tracing-subscriber.workspace = true
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util.workspace = true
http.workspace = true
http-body-util.workspace = true
bytes.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
rustls-native-certs.workspace = true
p256.workspace = true
hkdf.workspace = true
aes-gcm.workspace = true
sha2.workspace = true
subtle.workspace = true
url.workspace = true
flate2.workspace = true
base64.workspace = true
uuid.workspace = true
thiserror.workspace = true
rcgen = { workspace = true, optional = true }

[dev-dependencies]
campfire_jobs = { workspace = true, features = ["test-support"] }
campfire_cable = { workspace = true, features = ["test-support"] }
campfire_kit = { workspace = true, features = ["test-support"] }
campfire_db = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["test-util"] }
rcgen.workspace = true
tempfile.workspace = true
rusqlite = { workspace = true, features = ["limits", "trace"] }
