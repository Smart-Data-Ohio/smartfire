<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15171c" media="(prefers-color-scheme: dark)">
<title>Smartfire | Offline</title>
<link rel="icon" href="data:,">
<style>
  :root {
    color-scheme: light dark;
    --offline-bg: #ffffff;
    --offline-text: #1c1e21;
    --offline-muted: #5f6368;
    --offline-accent: #0b57d0;
    --offline-card-border: #dadce0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --offline-bg: #15171c;
      --offline-text: #e8eaed;
      --offline-muted: #9aa0a6;
      --offline-accent: #8ab4f8;
      --offline-card-border: #3c4043;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
    background: var(--offline-bg);
    color: var(--offline-text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    line-height: 1.5;
  }
  main {
    max-width: 26rem;
    text-align: center;
    border: 1px solid var(--offline-card-border);
    border-radius: 0.75rem;
    padding: 2rem 1.5rem;
  }
  h1 { font-size: 1.25rem; margin: 0 0 0.5rem; }
  p { margin: 0 0 1rem; color: var(--offline-muted); }
  .offline-dot {
    display: inline-block;
    width: 0.6rem;
    height: 0.6rem;
    border-radius: 999px;
    background: var(--offline-accent);
    margin-right: 0.5rem;
    vertical-align: baseline;
  }
  @media (prefers-reduced-motion: no-preference) {
    .offline-dot { animation: offline-pulse 1.6s ease-in-out infinite; }
    @keyframes offline-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.25; }
    }
  }
  button {
    font: inherit;
    font-weight: 600;
    color: #fff;
    background: var(--offline-accent);
    border: 0;
    border-radius: 0.5rem;
    padding: 0.6rem 1.25rem;
    cursor: pointer;
  }
  button:hover { filter: brightness(1.1); }
  button:focus-visible { outline: 2px solid var(--offline-text); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <h1><span class="offline-dot" aria-hidden="true"></span>You&rsquo;re offline &mdash; reconnecting&hellip;</h1>
  <p role="status" id="offline-status">Smartfire will reload automatically when your connection returns.</p>
  <button type="button" id="offline-retry">Try again now</button>
</main>
<script>
  (function () {
    var status = document.getElementById("offline-status");
    document.getElementById("offline-retry").addEventListener("click", function () {
      window.location.reload();
    });
    window.addEventListener("online", function () {
      if (status) status.textContent = "Connection restored. Reloading…";
      window.location.reload();
    });
  })();
</script>
</body>
</html>
